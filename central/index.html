  (d.demandas||[]).forEach(x=>{const D=DEMANDAS.find(y=>y.k===x.k);D.sub.forEach(s=>{if(!x[s])f.push(['dem',`${SUB_ROT[s]} de ${D.l}`])})});
  if(!temas.length&&!((d.tl||[]).length||(d.tc||[]).length))f.push(['dem','Temas']);
  if((d.tl||[]).includes('gen')&&!d.genOpc)f.push(['dem','Opção de Genética']);
  if((d.tl||[]).includes('sw')&&!(d.swOpc||[]).length)f.push(['dem','Qual software']);
  if(!d.objetivo)f.push(['dem','Objetivo']);
  if(!d.agendaOk)f.push(['qd','Confirmar a consulta à agenda']);
  if(!d.urgencia)f.push(['qd','Urgência']);
  if(!d.dataInicio)f.push(['qd','Início dos atendimentos']);if(!d.dataFim)f.push(['qd','Fim dos atendimentos']);
  if(d.dataInicio&&d.dataFim&&d.dataFim<d.dataInicio)f.push(['qd','Fim antes do início']);
  if(!on){
    if(!d.transporte)f.push(['qd','Transporte']);
    if(precisaDesl(d)){
      if(!d.dataIda)f.push(['qd','Data de ida']);if(!d.dataVolta)f.push(['qd','Data de volta']);
      if(d.dataIda&&d.dataInicio&&d.dataIda>d.dataInicio)f.push(['qd','Ida depois do início']);
      if(d.dataVolta&&d.dataFim&&d.dataVolta<d.dataFim)f.push(['qd','Volta antes do fim']);
      if(!d.cidadeChegada)f.push(['qd','Cidade de destino']);
      if(d.transporte==='Comercial'){if(!d.buscaNome)f.push(['qd','Quem vai buscar o técnico']);if(!d.localEncontro)f.push(['qd','Local de encontro']);if(!d.horaSaida)f.push(['qd','Horário de saída'])}
      else if(!d.horaChegada)f.push(['qd','Horário de chegada']);
      if(d.transporte==='Aéreo'){if(!d.aeroporto)f.push(['qd','Aeroporto de chegada']);if(!d.vooIda||!d.vooVolta)f.push(['qd','Voos sugeridos']);if(!d.trechoFinal)f.push(['qd','Trecho do aeroporto ao destino']);
        if(d.trechoFinal==='Comercial'){if(!d.buscaNome)f.push(['qd','Quem busca no aeroporto']);if(!d.horaBusca)f.push(['qd','Horário da busca no aeroporto'])}}
    }
    if(!d.semHosp){if(!d.cidadeHospedagem)f.push(['qd','Cidade de hospedagem']);if(!(d.hoteis||[]).filter(h=>h.nome).length)f.push(['qd','Sugestão de hotel'])}
  }
  return f;
}

function resumoNova(d){
  const tl=tecsSel(d),on=soOnline(d),temas=temasDe(d),fal=faltasNova(d);
  const lin=(k,v)=>v?`<div class="rs-l"><dt>${k}</dt><dd>${v}</dd></div>`:'';
  const per=d.dataInicio&&d.dataFim&&d.dataFim>=d.dataInicio?`${fmtD(d.dataInicio)} a ${fmtD(d.dataFim)}<small>${diasEntre(d.dataInicio,d.dataFim)} dia${diasEntre(d.dataInicio,d.dataFim)>1?'s':''} de atendimento</small>`:'';
  const orig=tl[0]?.cidadeBase||'';
  const ic={Técnico:'🚗',Comercial:'🚙',Aéreo:'✈'};
  const pernas=d.transporte==='Aéreo'?[orig||'Cidade do técnico','✈',d.aeroporto,...(d.trechoFinal&&d.trechoFinal!=='Mesma'&&d.cidadeChegada?[d.trechoFinal==='Comercial'?'🚙':'🚗',d.cidadeChegada]:[])]:[d.transporte==='Comercial'?(d.localEncontro||orig||'Local de encontro'):(orig||'Cidade do técnico'),ic[d.transporte]||'→',d.cidadeChegada];
  const rota=on?'<span class="rota-x">On-line, sem deslocamento</span>':(d.transporte&&(d.cidadeChegada||d.aeroporto))?`<span class="rota">${pernas.filter(Boolean).map((x,k)=>k%2?`<i aria-hidden="true">${x}</i>`:`<span>${esc(x)}</span>`).join('')}</span><small>${esc(TRANSP_ROT[d.transporte]||'')}${d.transporte==='Comercial'&&d.buscaNome?' · busca: '+esc(d.buscaNome):''}${d.trechoFinal==='Comercial'&&d.buscaNome?' · busca no aeroporto: '+esc(d.buscaNome):''}</small>`:d.transporte?`<span class="rota-x">${esc(TRANSP_ROT[d.transporte])}</span>`:'';
  const hot=d.semHosp?'Não precisa':(d.hoteis||[]).filter(h=>h.nome).length?`${(d.hoteis||[]).filter(h=>h.nome).length} sugest${(d.hoteis||[]).filter(h=>h.nome).length>1?'ões':'ão'} em ${esc(d.cidadeHospedagem||'')}`:'';
  const total=fal.length;
  return `<aside class="rs" aria-label="Resumo do pedido"><div class="rs-in">
    <p class="rs-k">Resumo do pedido</p>
    <dl>${lin('Solicitante',d.gerenteNome?esc(d.gerenteNome):'')}${lin('Regional',d.regional?esc(d.regional)+(d.distrital?`<small>Distrital ${esc(d.distrital)}</small>`:''):'')}
    ${lin('Demanda',(d.demandas||[]).map(x=>esc(demandaTxt(x))).join('<br>'))}${lin('Temas',temas.map(esc).join('<br>'))}
    ${lin(tl.length>1?'Técnicos':'Técnico',tl.map(t=>esc(t.nome)).join('<br>'))}${lin('Período',per)}${lin('Deslocamento',rota)}${lin('Hospedagem',on?'':hot)}</dl>
    ${total?`<div class="rs-f"><b>${total===1?'Falta 1 item':`Faltam ${total} itens`}</b><ul>${fal.slice(0,6).map(([,t])=>`<li>${esc(t)}</li>`).join('')}${total>6?`<li>e mais ${total-6}</li>`:''}</ul></div>`:'<div class="rs-ok">Tudo preenchido. Revise e envie.</div>'}
    <button class="btn primary rs-b" type="submit" id="nsend">Enviar solicitação</button>
    <p class="ferr" id="nerr" hidden></p>
  </div></aside>`;
}

  if(pf.length){
    const bloco=(lista,pre,sel,tit)=>`${tit?`<p class="sub-t">${tit}</p>`:''}<div class="chs chs-4">${lista.map(T=>chx('checkbox',pre,T.k,T.l,(sel||[]).includes(T.k))).join('')}</div>`;

    qd+=`<div class="blk"><h4 class="blk-t">Deslocamento</h4>`+grupo('Como o técnico vai chegar',true,`<div class="chs chs-3">${TRANSP.map(([v,l,x])=>chx('radio','transporte',v,l,d.transporte===v,x)).join('')}</div>`);

        ${d.trechoFinal&&d.trechoFinal!=='Mesma'?`<div class="row2">${fd('n_cidadeChegada','Cidade do atendimento',true,inp('cidadeChegada',d.cidadeChegada,'placeholder="Ex.: Xanxerê/SC"'))}${d.trechoFinal==='Comercial'?fd('n_horaBusca','Horário da busca no aeroporto',true,inp('horaBusca',d.horaBusca,'type="time"')):''}</div>`:d.trechoFinal==='Mesma'?`<input type="hidden" name="cidadeChegada" value="${esc(d.aeroporto||d.cidadeChegada||'')}">`:''}
        ${d.trechoFinal==='Técnico'?(()=>{const lr=linkRota(d.aeroporto,d.cidadeChegada);return `<div class="ext"><span class="fd-h">Trecho do aeroporto até a cidade do atendimento.</span><a class="btn ext-b${lr?'':' is-off'}" ${lr?`href="${lr}" target="_blank" rel="noopener"`:'aria-disabled="true"'}>Ver rota no Google Maps</a></div>`})():''}
        ${d.trechoFinal==='Comercial'?busca('Quem vai buscar no aeroporto','','',fd('n_obsTrajeto','Ponto de encontro no aeroporto',false,inp('obsTrajeto',d.obsTrajeto,'placeholder="Ex.: saída do desembarque"'))):''}</div>`}
    }
    qd+=`</div>`;
    const ent=d.dataIda||d.dataInicio,sai=d.dataVolta||d.dataFim,lh=linkHotel(d.cidadeHospedagem||d.cidadeChegada,ent,sai);
    qd+=`<div class="blk"><h4 class="blk-t">Hospedagem</h4>${chx('checkbox','semHosp','1','Não precisa de hospedagem',d.semHosp,'Ida e volta no mesmo dia, ou o técnico fica em casa')}`;
    if(!d.semHosp)qd+=`<div class="row2">${fd('n_cidadeHospedagem','Cidade de hospedagem',true,inp('cidadeHospedagem',d.cidadeHospedagem,'placeholder="Ex.: Chapecó/SC"'))}<div class="ext ext-c"><a class="btn ext-b${lh?'':' is-off'}" ${lh?`href="${lh}" target="_blank" rel="noopener"`:'aria-disabled="true"'}>Pesquisar hotéis no Booking.com</a></div></div>
      <div class="hoteis"><p class="fd-l">Sugestões de hotel <em class="obr">*</em> <span class="fd-x">até 3 opções; cole o link de cada uma se tiver</span></p>${[0,1,2].map(i=>{const h=(d.hoteis||[])[i]||{};return `<div class="hotel"><span class="h-n">${i+1}ª opção</span><input class="field" name="hotelNome" aria-label="Nome do hotel, ${i+1}ª opção" placeholder="Nome do hotel" value="${esc(h.nome||'')}"><input class="field" name="hotelLink" type="url" aria-label="Link do hotel, ${i+1}ª opção" placeholder="Link" value="${esc(h.link||'')}"></div>`}).join('')}</div>`;
    qd+=`</div>`;
  }else qd+=`<p class="note-on">Como todas as demandas são on-line, não há deslocamento nem hospedagem.</p>`;
  const sec=(n,id,t,desc,body)=>`<section class="st" id="st-${id}"><header class="st-h"><span class="st-n" aria-hidden="true">${n}</span><div><h3>${t}</h3><p>${desc}</p></div></header><div class="st-b">${body}</div></section>`;
  return `<div class="nv-top"><h2>Solicitar agenda técnica</h2><p>Três etapas, uns cinco minutos. O resumo ao lado mostra o que já está pronto e o que falta.</p></div>
  <form class="nv" id="fnova" novalidate><div class="nv-grid"><div class="nv-main">
   ${sec(1,'quem','Quem está solicitando','Seus dados e a regional que vai receber o atendimento.',quem)}
   ${sec(2,'dem','A demanda','O que precisa ser feito e sobre quais temas.',dem)}
   ${sec(3,'qd','Quando e onde','Datas, técnicos, deslocamento e hospedagem.',qd)}
  </div>${resumoNova(d)}</div></form>`;
}

function lerNova(f){
  const d0=S.draft||{};if(!f)return d0;
  const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim(),d={};
  d.solTipo=g('solTipo');

  d.perfis=fd.getAll('perfis');
  const dem=fd.getAll('dem');d.demandas=DEMANDAS.filter(D=>dem.includes(D.k)).map(D=>{const x={k:D.k};D.sub.forEach(s=>{x[s]=(fd.get(`dem_${D.k}_${s}`)||'').toString()});return x});

function bindNova(){

  const rr=()=>{const y=window.scrollY,a=document.activeElement?.name;render();window.scrollTo(0,y)};
  f.addEventListener('change',e=>{
    S.draft=lerNova(f);
    if(e.target.name==='solTipo'){const st=S.draft.solTipo;S.draft={...S.draft,gerenteNome:'',gerenteEmail:'',gerenteTelefone:''};if(st==='reg'&&S.draft.regional){const r=regInfo(S.draft.regional)||{};S.draft.gerenteNome=r.representante||'';S.draft.gerenteEmail=r.email||'';S.draft.gerenteTelefone=r.telefone||''}}
    if(reRender.includes(e.target.name)||/^dem_/.test(e.target.name))rr();
  });
  f.addEventListener('input',e=>{if(e.target.matches('.cb-in'))return;S.draft=lerNova(f)});
  f.addEventListener('focusout',e=>{if(['cidadeChegada','cidadeHospedagem','aeroporto','buscaNome','gerenteNome','gerenteEmail','gerenteTelefone','objetivo','horaChegada','vooIda','vooVolta','hotelNome'].includes(e.target.name)){S.draft=lerNova(f);const r=$('.rs');if(r){r.outerHTML=resumoNova(S.draft)}if(['cidadeChegada','cidadeHospedagem','aeroporto'].includes(e.target.name))setTimeout(()=>{if(!f.contains(document.activeElement)||document.activeElement===document.body)rr();else{const nx=document.activeElement.name;rr();const el=nx&&$(`#fnova [name="${nx}"]`);if(el)el.focus()}},0)}});
  f.addEventListener('submit',async e=>{
    e.preventDefault();const d=lerNova(f);S.draft=d;const fal=faltasNova(d);
    if(fal.length){const r=$('.rs');if(r)r.outerHTML=resumoNova(d);const err=$('#nerr');err.textContent='Complete os itens da lista para enviar.';err.hidden=false;const alvo=$('#st-'+fal[0][0]);if(alvo)alvo.scrollIntoView({block:'start',behavior:'smooth'});return}
    const b=$('#nsend'),err=$('#nerr');b.disabled=true;b.textContent='Enviando…';
    const on=soOnline(d),n=diasEntre(d.dataInicio,d.dataFim),desl=precisaDesl(d);
    const doc={v:2,solTipo:d.solTipo,gerenteNome:d.gerenteNome,gerenteEmail:d.gerenteEmail,gerenteTelefone:d.gerenteTelefone,regional:d.regional,distrital:d.distrital||regInfo(d.regional)?.distrital||'',
      perfis:d.perfis,demandas:d.demandas,tipo:d.demandas.map(demandaTxt).join(' · '),temas:temasDe(d),genOpc:d.genOpc||'',swOpc:d.swOpc,objetivo:d.objetivo,clientesPrev:d.clientesPrev,
      urgencia:d.urgencia,tecPrefs:d.tecPrefs,tecPref:d.tecPrefs[0]||'',dataInicio:d.dataInicio,dataFim:d.dataFim,dataSugerida:d.dataInicio,duracao:n===1?'1 dia':n+' dias',agendaConsultada:true,
      ...(on?{online:true}:{transporte:d.transporte,
        ...(desl?{dataIda:d.dataIda,dataVolta:d.dataVolta,cidadeChegada:d.cidadeChegada,obsTrajeto:d.obsTrajeto,
          ...(d.transporte==='Comercial'?{buscaNome:d.buscaNome,localEncontro:d.localEncontro,horaSaida:d.horaSaida}:{horaChegada:d.horaChegada}),
          ...(d.transporte==='Aéreo'?{aeroporto:d.aeroporto,vooIda:d.vooIda,vooVolta:d.vooVolta,vooLink:d.vooLink,trechoFinal:d.trechoFinal,...(d.trechoFinal==='Comercial'?{buscaNome:d.buscaNome,horaBusca:d.horaBusca}:{})}:{})}:{}),
        ...(d.semHosp?{semHospedagem:true}:{cidadeHospedagem:d.cidadeHospedagem,hoteis:(d.hoteis||[]).filter(h=>h.nome)})}),
      status:'Solicitada',criadoEm:Date.now(),atualizadoEm:Date.now(),codigo:'AT-'+Date.now().toString(36).slice(-5).toUpperCase()};
    if(S.uid)doc.criadoPor=S.uid;
    try{const ref=await S.db.collection(P_SOL).add(doc);S.draft=null;S.enviado=ref.id;render();window.scrollTo(0,0)}
    catch(x){b.disabled=false;b.textContent='Enviar solicitação';err.textContent=x?.code==='invalid_argument'?'Você não tem permissão para enviar. Peça acesso de Colaborador à gestão.':'Não foi possível enviar agora. Verifique a conexão e tente de novo.';err.hidden=false}

/* linhas extras no detalhe da solicitação (formulário v2) */
function dlV2(s){
  if(s.v!==2)return [];
  const rot={gp:'Gestor de Pasta',tec:'Técnico',reg:'Distrital e Regional'}[s.solTipo]||'';
  const hot=(s.hoteis||[]).map((h,i)=>`${i+1}. ${h.nome}${h.link?' — '+h.link:''}`).join('\n');
  return [['Solicitante é',rot],['Telefone do solicitante',s.gerenteTelefone],['Perfil',(s.perfis||[]).join(' e ')],
    ['Período dos atendimentos',s.dataInicio?`${fmtD(s.dataInicio)} a ${fmtD(s.dataFim)}`:''],
    ['Técnicos de preferência',(s.tecPrefs||[]).length>1?s.tecPrefs.map(tecNome).join(', '):''],['Deslocamento',s.online?'Atendimento on-line':s.transporte?`${({Técnico:'Transporte sob responsabilidade do técnico (a)',Comercial:'Transporte sob responsabilidade da equipe comercial'})[s.transporte]||s.transporte}${s.dataIda?`\nIda ${fmtD(s.dataIda)} e volta ${fmtD(s.dataVolta)}`:''}`:''],
    ['Quem busca o técnico',s.transporte==='Comercial'&&s.buscaNome?`${s.buscaNome}${s.localEncontro?' · encontro em '+s.localEncontro:''}${s.horaSaida?' · saída às '+s.horaSaida:''}`:''],
    ['Aeroporto de chegada',s.aeroporto],
    ['Do aeroporto ao destino',s.transporte==='Aéreo'&&s.trechoFinal?({Mesma:'O aeroporto já é na cidade do atendimento',Técnico:'Transporte sob responsabilidade do técnico (a)',Comercial:`Equipe comercial busca: ${s.buscaNome||''}${s.horaBusca?' às '+s.horaBusca:''}`})[s.trechoFinal]:''],
    ['Chegar até',s.horaChegada?`${s.horaChegada} em ${s.cidadeChegada||''}`:''],
    ['Voo de ida sugerido',s.vooIda],['Voo de volta sugerido',s.vooVolta],['Link do voo',s.vooLink],['Observações do trajeto',s.obsTrajeto],
    ['Hospedagem',s.semHospedagem?'Não precisa':s.cidadeHospedagem?`${s.cidadeHospedagem}${hot?'\n'+hot:''}`:''],
    ['Agenda consultada pelo solicitante',s.agendaConsultada?'Sim':'']];
}

/* ================= Disponibilidade dos técnicos (para quem solicita) ================= */
const OCUP_CATS={atendimento:'o',deslocamento:'o',treinamento:'o',evento:'o',ferias:'o',particular:'o',reuniao:'p',homeoffice:'p',outros:'p'};
function ocupacaoDe(){
  /* visitas agendadas (todos podem ler) + resumo da agenda pessoal publicado pela gestão */
  const m={};const marca=(t,d,v)=>{const o=(m[t]=m[t]||{});if(o[d]!=='o')o[d]=v};
  const pub=S.ocup?.porTec||{};for(const[t,o] of Object.entries(pub))for(const[d,v] of Object.entries(o))marca(t,d,v);
  const av=agVisitas();for(const[t,o] of Object.entries(av))for(const d of Object.keys(o))marca(t,d,'o');
  return m;
}
function disp(){
  const mes=S.f.dmes||hoje().slice(0,7);const[y,mm]=mes.split('-').map(Number);
  const n=new Date(y,mm,0).getDate(),dias=[...Array(n)].map((_,i)=>`${mes}-${String(i+1).padStart(2,'0')}`);
  const oc=ocupacaoDe(),fer=agFeriados(y);
  const tecs=sortN(S.tec).filter(t=>!SEM_REL_2026.includes(t.id));
  const nav=(k)=>{const d=new Date(y,mm-1+k,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
  const nomeMes=(m=>m[0].toUpperCase()+m.slice(1))(new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const wd=d=>new Date(d+'T12:00').getDay();
  return `<div class="bar"><h2>Disponibilidade dos técnicos</h2></div>
  <p class="muted" style="margin:-4px 0 14px;max-width:70ch">Consulte os dias livres antes de sugerir as datas na sua solicitação. Aqui aparecem só os períodos ocupados, sem detalhes dos atendimentos.${S.ocup?.atualizadoEm?` Agenda pessoal dos técnicos atualizada em ${fmtTs(S.ocup.atualizadoEm)}.`:''}</p>
  <div class="disp-nav"><button class="btn small" type="button" data-dmes="${nav(-1)}" aria-label="Mês anterior">‹</button><b>${nomeMes}</b><button class="btn small" type="button" data-dmes="${nav(1)}" aria-label="Próximo mês">›</button>
   <span class="disp-leg"><i class="c-l"></i>Livre <i class="c-p"></i>Compromisso parcial <i class="c-o"></i>Ocupado <i class="c-f"></i>Feriado / fim de semana</span></div>
  <section class="panel disp-wrap"><table class="disp"><thead><tr><th>Técnico</th>${dias.map(d=>`<th class="${[0,6].includes(wd(d))?'fds':''}"><span>${'DSTQQSS'[wd(d)]}</span>${+d.slice(8)}</th>`).join('')}</tr></thead>
  <tbody>${tecs.map(t=>`<tr><th><b>${esc(t.nome)}</b>${t.cidadeBase?`<small>${esc(t.cidadeBase)}</small>`:''}</th>${dias.map(d=>{const f=fer[d],w=[0,6].includes(wd(d)),v=(oc[t.id]||{})[d];const c=v==='o'?'c-o':v==='p'?'c-p':(f||w)?'c-f':'c-l';const tt=v==='o'?'Ocupado':v==='p'?'Compromisso parcial':f?'Feriado: '+f.join(', '):w?'Fim de semana':'Livre';return `<td class="${c}" title="${esc(t.nome+' · '+fmtD(d)+' · '+tt)}"></td>`}).join('')}</tr>`).join('')}</tbody></table></section>`;
}
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-dmes]');if(b){S.f.dmes=b.dataset.dmes;render()}});
/* a gestão publica um resumo (sem detalhes) da agenda pessoal dos técnicos, para quem solicita poder ver */
let _ocupT=null,_ocupH='';
function publicarOcupacao(){
  if(!S.gestor||!S.ag?.carregada)return;clearTimeout(_ocupT);
  _ocupT=setTimeout(async()=>{
    const ini=hoje().slice(0,7)+'-01',fim=addDias(ini,400),porTec={};
    for(const t of S.tec){const o={};for(let d=ini;d<=fim;d=addDias(d,1)){let v='';for(const s of agBruto(t.id,d)){const c=OCUP_CATS[agParse(s).cat];if(c==='o'){v='o';break}if(c==='p')v='p'}if(v)o[d]=v}if(Object.keys(o).length)porTec[t.id]=o}
    const h=JSON.stringify(porTec);if(h===_ocupH||h===JSON.stringify(S.ocup?.porTec||{})){_ocupH=h;return}
    try{await S.db.doc('cad/ocupacao').set({porTec,atualizadoEm:Date.now()});_ocupH=h}catch(_){}
  },1500);
}
