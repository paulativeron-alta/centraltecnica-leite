<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17305C">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="../config.js"></script>
<script src="../core/alta.js"></script>
<script>if(!ALTA.guarda())document.documentElement.style.display='none';</script>
<title>Central de Atendimento Técnico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: service desk — sticky header with role-aware tabs; summary first, then lists; sheets for detail, scheduling and closing */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --ink:#141c26; --muted:#566273; --line:#d7dee7;
  --accent:#1f5a85; --accent-ink:#ffffff; --soft:#dde8f2;
  --s-sol:#9a5b06; --s-sol-bg:#fbedd5; --s-ag:#1f5a85; --s-ag-bg:#dde8f2; --s-ok:#1f7448; --s-ok-bg:#dcf0e4; --s-x:#6b7480; --s-x-bg:#e6e9ee;
  --bad:#b3261e; --bad-bg:#f9dedb;
  --segA:#1f7448; --segB:#1f5a85; --segC:#9a5b06; --c1:#2f6db0; --c2:#c4661f; --c3:#7a5bb5;
  --shadow:0 1px 2px rgb(15 30 50 / .06),0 10px 30px rgb(15 30 50 / .10);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131a; --surface:#151d27; --sunk:#10171f; --ink:#e3e9f0; --muted:#97a3b3; --line:#283442;
  --accent:#7db7e3; --accent-ink:#0b1622; --soft:#1a2b3b;
  --s-sol:#f1b25e; --s-sol-bg:#33240f; --s-ag:#7db7e3; --s-ag-bg:#16283a; --s-ok:#6fd39c; --s-ok-bg:#163022; --s-x:#9aa4b0; --s-x-bg:#1e2630;
  --bad:#f2847a; --bad-bg:#371815;
  --segA:#6fd39c; --segB:#7db7e3; --segC:#f1b25e; --c1:#5b95d4; --c2:#c97a3a; --c3:#9a7fd6;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131a; --surface:#151d27; --sunk:#10171f; --ink:#e3e9f0; --muted:#97a3b3; --line:#283442;
  --accent:#7db7e3; --accent-ink:#0b1622; --soft:#1a2b3b;
  --s-sol:#f1b25e; --s-sol-bg:#33240f; --s-ag:#7db7e3; --s-ag-bg:#16283a; --s-ok:#6fd39c; --s-ok-bg:#163022; --s-x:#9aa4b0; --s-x-bg:#1e2630;
  --bad:#f2847a; --bad-bg:#371815;
  --segA:#6fd39c; --segB:#7db7e3; --segC:#f1b25e; --c1:#5b95d4; --c2:#c97a3a; --c3:#9a7fd6;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.brand .grow{flex:1;min-width:160px}
.role{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px 11px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--s-sol-bg);color:var(--s-sol);font-size:.74rem;font-weight:700;text-align:center}

main{padding-block:20px 90px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:1.4rem;flex:1;min-width:180px;font-weight:800;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.92rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .field{flex:1 1 170px;width:auto}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--k,var(--line))}
.kpi .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--f-display);font-size:1.8rem;font-weight:800;line-height:1.2;margin-top:4px}
.kpi .sub{font-size:.84rem;color:var(--muted)}

.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cols3{grid-template-columns:minmax(0,1fr)}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:700}
.panel h3 .hint{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:auto}

.rows{display:grid}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0;padding-top:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row:hover .t{color:var(--accent)}
.row .s{color:var(--muted);font-size:.86rem}
.row .end{display:grid;justify-items:end;gap:4px;text-align:right}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:none}
.st-Solicitada{background:var(--s-sol-bg);color:var(--s-sol)}
.st-Agendada{background:var(--s-ag-bg);color:var(--s-ag)}
.st-Concluída{background:var(--s-ok-bg);color:var(--s-ok)}
.st-Cancelada{background:var(--s-x-bg);color:var(--s-x)}
.st-NaoAg{background:var(--s-x-bg);color:var(--ink);outline:1px dashed var(--s-x);outline-offset:-1px}
.chip.dot::before{display:block}
.chip.urg-Alta{background:var(--bad-bg);color:var(--bad)}
.segA,.segB,.segC{font-family:var(--f-display);font-weight:800;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-size:.85rem;border:1.5px solid currentColor}
.segA{color:var(--segA)}.segB{color:var(--segB)}.segC{color:var(--segC)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:820px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}

.hbar{display:grid;grid-template-columns:minmax(70px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:.9rem}
.hbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:6px}
.hbar .v{font-weight:700;text-align:right}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:1.02rem}
.empty p{margin:0;max-width:56ch}
.mini-empty{color:var(--muted);font-size:.9rem;margin:0}
.notice{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;background:var(--soft);color:var(--accent)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

/* form */
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){form.f{grid-template-columns:minmax(0,1fr)}}
form.f .full{grid-column:1/-1}
form.f label,form.f fieldset{display:grid;gap:5px;font-size:.86rem;font-weight:600;color:var(--muted)}
form.f fieldset{border:0;padding:0;margin:0}
form.f legend{padding:0;margin-bottom:5px}
form.f textarea{min-height:84px;resize:vertical}
.req{color:var(--bad)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:500;color:var(--ink);cursor:pointer;background:var(--surface);font-size:.9rem}
.opts label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.opts input{accent-color:var(--accent);margin:0}
.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);color:var(--ink);font-weight:500;font-size:.92rem}
.yn:first-of-type{border-top:0}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.section h3{font-size:1rem;font-weight:700;color:var(--ink)}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.ferr{grid-column:1/-1;margin:0;color:var(--bad);font-size:.9rem;font-weight:600}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgb(8 16 26 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.backdrop{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sheet .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet .head .grow{flex:1;min-width:0}
.sheet .head h2{font-size:1.25rem;font-weight:800}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.sheet h3{font-size:.98rem;margin:20px 0 8px;font-weight:700}
.dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:7px 16px;font-size:.92rem;margin:0}
@media (max-width:520px){.dl{grid-template-columns:minmax(0,1fr)}.dl dd{margin-bottom:6px}}
.dl dt{color:var(--muted)}
.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.timeline{display:flex;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.timeline .st{flex:1 1 120px;padding:8px 10px;border-top:3px solid var(--line);font-size:.82rem;color:var(--muted)}
.timeline .st b{display:block;color:var(--ink);font-size:.86rem}
.timeline .st.on{border-top-color:var(--accent)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--sunk);display:grid;gap:10px}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.9rem;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.mailhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.88rem}
.mailhead span:nth-child(odd){color:var(--muted)}
.mailhead span{word-break:break-all}
.cli{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.4fr) auto auto;gap:6px;align-items:center}
@media (max-width:700px){.cli{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cli .seghold,.cli .del{justify-self:start}}
.cli-head{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
@media (max-width:700px){.cli-head{display:none}}
.cli-row{padding:8px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.done-card{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 20px}
.done-card .ok{width:52px;height:52px;border-radius:50%;background:var(--s-ok-bg);color:var(--s-ok);display:grid;place-items:center;font-size:1.6rem;font-weight:800}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<style>
.areas{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.areas button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.areas button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.who b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:.84rem;text-decoration:underline;text-underline-offset:2px}
.bk{display:grid;gap:2px}
.bk .r{display:grid;grid-template-columns:minmax(0,1fr) 44px 52px;gap:10px;align-items:center;font-size:.88rem;padding:5px 0;border-top:1px solid var(--line)}
.bk .r:first-child{border-top:0}
.bk .lab{min-width:0}
.bk .lab span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .lab i{display:block;height:5px;border-radius:3px;background:var(--accent);margin-top:4px;opacity:.85}
.bk .n,.bk .p{text-align:right;font-weight:700}
.bk .p{color:var(--muted);font-weight:600}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.funnel div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.funnel b{display:block;font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.funnel span{font-size:.8rem;color:var(--muted)}
.funnel.f6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:900px){.funnel.f6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.funnel.f6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.funnel small{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.funnel em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--accent)}
.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.delta{font-size:.78rem;font-weight:700}
.delta.up{color:var(--s-ok)}.delta.down{color:var(--bad)}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-size:1.05rem}
.counter input{width:64px;text-align:center}
.ativ{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem;color:var(--ink);font-weight:500}
.ativ:first-child{border-top:0}
.nota{display:flex;gap:4px;flex-wrap:wrap}
.nota label{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;font-weight:700;color:var(--ink);background:var(--surface)}
.nota label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nota input{position:absolute;opacity:0;pointer-events:none}
.nota-scale{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);max-width:460px}
.ccard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ccard{grid-template-columns:minmax(0,1fr)}}
.ccard .full{grid-column:1/-1}
.ccard .top{display:flex;align-items:center;gap:8px;grid-column:1/-1}
.ccard .top b{flex:1;font-family:var(--f-display)}
.hint-box{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.prefill{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;font-size:.88rem;background:var(--sunk);border-radius:8px;padding:10px 14px}
.prefill span{color:var(--muted);display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.st-Pendente{background:var(--bad-bg);color:var(--bad)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:4px}
.choice button:hover,.choice button[aria-pressed="true"]{border-color:var(--accent)}

<script>
(function(){
/* ================= constantes ================= */
const P_SOL='solicitacoes',P_TEC='cad/config/tecnicos',P_EST='cad/estrutura',P_CFG='cad/config';
const TIPOS=['Visita técnica presencial','Atendimento remoto / online','Treinamento de equipe','Palestra ou evento'];
const TEMAS=['Genética – Leite Europeu','Genética – Leite Zebuíno / Girolando','Reprodução','Cria e recria (bezerras)','Colostro e colostragem','Sanidade','Nutrição','Gestão e indicadores','Outro'];
const PERGUNTAS=[
 ['revendas','Atendimento de Revendas, cooperativas, laticínios e/ou prefeituras?','Revendas / cooperativas / laticínios / prefeituras'],
 ['altaCria','Atendimento em Alta CRIA?','Alta CRIA'],
 ['advantage','Atendimento em Advantage ou Alta Integra?','Advantage / Alta Integra'],
 ['treinEquipe','Treinamento de Equipe Alta?','Treinamento de equipe Alta'],
 ['eventoExt','Treinamento, palestra ou participação em evento externo?','Evento externo']
];
const URG=['Baixa','Média','Alta'];
const SITUACOES=['Cliente com faturamento','Cliente prospectado (ainda não compra da Alta)','Cliente recuperado (sem faturamento há mais de 1 ano)'];
const sitNorm=x=>/prospect/i.test(x||'')?SITUACOES[1]:/recuperado/i.test(x||'')?SITUACOES[2]:SITUACOES[0];
const isProsp=c=>/prospect/i.test(c.situacao||'');
const PUB={treinEquipe:'pessoas treinadas',palestras:'pessoas no público',eventos:'clientes atendidos'};
const ORIGENS=['Necessidade da equipe técnica','Necessidade da equipe comercial','Necessidade do cliente'];
const ATIV=[['treinEquipe','Treinamentos da equipe Alta'],['palestras','Treinamentos ou palestras externas'],['coops','Visitas a cooperativas e/ou revendas'],['eventos','Participações em eventos, julgamentos ou feiras']];
const CFG_PADRAO={segA:300000,segB:100000,prazoRel:3,metaAceite:90,metaVisita:80,metaRel:90,metaCanc:10,metaNaoAg:10,ocupMin:60,ocupMax:80,assinatura:'Dra. Paula Tiveron\nCoordenadora de Produtos e Serviços Leite'};
const AREAS={rep:'Representante',tec:'Equipe técnica',gest:'Gestão'};
const TABS={
  rep:[['rinicio','Resumo'],['nova','Solicitar agenda'],['rlista','Minhas solicitações'],['rconc','Visitas concluídas']],
  tec:[['tagenda','Minha agenda'],['tpend','Relatórios pendentes'],['tconc','Concluídos']],
  gest:[['gpainel','Indicadores'],['glista','Solicitações'],['gagenda','Agenda técnica'],['grel','Relatórios'],['gbases','Bases de dados'],['gcad','Cadastros']]
};

const S={sol:[],tec:[],reg:[],dist:[],cfg:{},perfil:null,loaded:{},gestor:false,canWrite:true,uid:null,db:null,dbState:'loading',
  area:null,tab:null,verTec:'',relDrafts:{},pc:{},clientes:[],prosp:[],vendas:null,vendasMeta:null,cria:null,integra:null,criaIx:null,integraIx:null,f:{reg:'',dist:'',st:'Todas',q:'',per:'30',creg:'',ctec:'',cper:'ano',rtodas:false,cadq:'',trend:'mes'},draft:null};
try{const x=JSON.parse(localStorage.getItem('cat-ui')||'{}');if(x.area)S.area=x.area;if(x.tab)S.tab=x.tab;if(x.per)S.f.per=x.per}catch(e){}
const salvarUI=()=>{try{localStorage.setItem('cat-ui',JSON.stringify({area:S.area,tab:S.tab,per:S.f.per}))}catch(e){}};

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>new Date().toLocaleDateString('sv');
const addDias=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};
const difDias=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const tsDia=t=>t?new Date(t).toLocaleDateString('sv'):'';
const fmtD=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
const fmtTs=t=>t?new Date(t).toLocaleDateString('pt-BR'):'—';
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const pct=(n,t)=>t?Math.round(n/t*100)+'%':'—';
const dec=n=>n==null||isNaN(n)?'—':n.toLocaleString('pt-BR',{maximumFractionDigits:1});
const byId=(a,id)=>a.find(x=>x.id===id);
const cfg=()=>Object.assign({},CFG_PADRAO,S.cfg||{});
const segmento=f=>{const c=cfg();f=Number(f)||0;if(!f)return'';return f>=c.segA?'A':f>=c.segB?'B':'C'};
const tecNome=id=>byId(S.tec,id)?.nome||'Técnico não definido';
const sortN=a=>[...a].sort((x,y)=>(x.nome||'').localeCompare(y.nome||'','pt-BR'));
const primeiroNome=n=>(n||'').trim().split(/\s+/)[0]||'';
const sn=v=>v===true?'Sim':v===false?'Não':'—';
const segBadge=f=>{const g=segmento(f);return g?`<span class="seg${g}" title="Segmento ${g}">${g}</span>`:'<span class="muted">—</span>'};
function periodoAg(a){
  if(!a||!a.inicio)return'';const i=a.inicio,f=a.fim||a.inicio;
  const [yi,mi,di]=i.split('-'),[yf,mf,df]=f.split('-');
  if(i===f)return `no dia ${di}/${mi}`;
  if(yi===yf&&mi===mf)return difDias(i,f)===1?`nos dias ${di} e ${df}/${mf}`:`de ${di} a ${df}/${mf}`;
  return `de ${di}/${mi} a ${df}/${mf}`;
}
const periodoCurto=a=>a?.inicio?fmtD(a.inicio)+(a.fim&&a.fim!==a.inicio?' a '+fmtD(a.fim):''):'—';
function saudacao(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
let tt;function toast(m){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2800)}
async function copiar(txt){try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch(e){toast('Selecione o texto e copie manualmente')}}

/* etapa: Solicitada → Agendada → Relatório pendente → Concluída (só com relatório) */
function etapa(s){
  if(s.status==='Cancelada')return'Cancelada';
  if(s.status==='Não agendada')return'Não agendada';
  if(s.relatorio?.enviadoEm)return'Concluída';
  if(s.agendamento?.tecnicoId){const fim=s.agendamento.fim||s.agendamento.inicio;return hoje()>=fim?'Relatório pendente':'Agendada'}
  return'Solicitada';
}
const ETAPAS=['Solicitada','Agendada','Relatório pendente','Concluída','Não agendada','Cancelada'];
const MOT_NAOAG=['Sem técnico disponível no período','Fora dos objetivos da equipe técnica','Outro motivo'];
const MOT_TROCA=['Técnico sugerido sem agenda no período','Outro técnico mais indicado para o tema','Outro motivo'];
const encerrada=s=>s.status==='Cancelada'||s.status==='Não agendada';
const stCls=e=>e==='Relatório pendente'?'st-Pendente':e==='Não agendada'?'st-NaoAg':'st-'+e;
const atrasoRel=s=>{const fim=s.agendamento?.fim||s.agendamento?.inicio;return fim?difDias(fim,hoje())-cfg().prazoRel:0};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const regInfo=n=>S.reg.find(r=>r.nome===n);
const fmtTel=v=>{const d=String(v||'').replace(/\D/g,'');if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return String(v||'').trim()};
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[type=tel]')){const f=fmtTel(t.value);if(f!==t.value){t.value=f;t.dispatchEvent(new Event('input',{bubbles:true}))}}});
const distInfo=n=>S.dist.find(d=>d.nome===n);
async function saveEst(regionais,distritais){await S.db.doc(P_EST).set({regionais,distritais,atualizadoEm:Date.now()})}
/* ---- campo de seleção com busca ---- */
const CBS={},CB={id:null,act:0,items:[]};
const ICO_BUSCA='<svg class="cb-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
function cbOptions(c){
  if(c.kind==='cli'){if(S._cliO?.src!==S.clientes)S._cliO={src:S.clientes,o:S.clientes.map(x=>{const s=(x.p||[]).map(p=>'Alta '+p).join(' · ');return{v:x.n,l:x.n,s,q:norm(x.n+' '+s)}})};return S._cliO.o}
  if(c.kind==='prosp')return sortN(S.prosp).map(p=>({v:p.nome,l:p.nome,s:[p.cidade,p.regional].filter(Boolean).join(' · ')}));
  if(c.kind==='dist')return sortN(S.dist).map(d=>{const n=S.reg.filter(r=>r.distrital===d.nome).length;return{v:d.nome,l:d.nome,s:`${n} regiona${n===1?'l':'is'}`}});
  let rs=sortN(S.reg);if(c.dist)rs=rs.filter(r=>r.distrital===c.dist);
  return rs.map(r=>({v:r.nome,l:r.nome,s:[r.representante,r.distrital?'Distrital '+r.distrital:''].filter(Boolean).join(' · ')}));
}
function cb(id,o){
  CBS[id]=o;const v=o.value||'';
  return `<div class="cb" data-cb="${id}" data-value="${esc(v)}">${ICO_BUSCA}<input class="field cb-in" id="${id}" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}_lb" autocomplete="off" spellcheck="false" placeholder="${esc(o.placeholder||'Procurar…')}" value="${esc(v)}">${o.name?`<input type="hidden" name="${o.name}" value="${esc(v)}">`:''}<button type="button" class="cb-x" data-cbclear="${id}" aria-label="Limpar seleção" ${v?'':'hidden'}>×</button><div class="cb-list" id="${id}_lb" role="listbox" hidden></div></div>`;
}
const cbEl=id=>document.querySelector(`.cb[data-cb="${id}"]`);
function cbSet(id,v){const w=cbEl(id);if(!w)return;v=v||'';w.dataset.value=v;w.querySelector('.cb-in').value=v;const h=w.querySelector('input[type=hidden]');if(h)h.value=v;w.querySelector('.cb-x').hidden=!v}
function cbOpen(id,q){
  const w=cbEl(id),c=CBS[id];if(!w||!c)return;
  const toks=norm(q).split(/\s+/).filter(Boolean);
  let it=cbOptions(c).filter(o=>{const q=o.q||norm(o.l+' '+o.s);return toks.every(t=>q.includes(t))});
  if(toks.length){const t0=toks.join(' ');it.sort((a,b)=>(norm(b.l).includes(t0)?1:0)-(norm(a.l).includes(t0)?1:0))}
  const total=it.length;it=it.slice(0,80);
  if(c.allLabel&&!toks.length)it.unshift({v:'',l:c.allLabel,s:''});
  CB.id=id;CB.items=it;const cur=w.dataset.value;
  CB.act=toks.length?0:Math.max(0,it.findIndex(o=>o.v===cur));
  const lb=w.querySelector('.cb-list');
  lb.innerHTML=it.length?it.map((o,i)=>`<div class="cb-opt" role="option" id="${id}_o${i}" data-i="${i}" aria-selected="${o.v===cur&&!!cur}"><b>${esc(o.l)}</b>${o.s?`<span>${esc(o.s)}</span>`:''}</div>`).join('')+(total>80?`<div class="cb-foot">Mostrando 80 de ${total}. Continue digitando para filtrar.</div>`:''):`<div class="cb-foot">Nada encontrado para “${esc(q)}”.</div>`;
  lb.hidden=false;w.querySelector('.cb-in').setAttribute('aria-expanded','true');cbAct(CB.act,!toks.length);
}

  const d=S.draft||{};
  const reg=d.regional??p.regional??'',dist=d.distrital??p.distrital??'';
  const v=k=>esc(d[k]??'');
  return `<div class="bar"><h2>Solicitar agenda técnica</h2></div>
  <form class="f" id="fnova" novalidate>
   <div class="section full"><h3>Quem está solicitando</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">

    <div class="fld"><label for="cbNDist">Distrital <span class="req">*</span></label>${cb('cbNDist',{kind:'dist',name:'distrital',value:dist,placeholder:'Procurar distrital…',onPick:()=>{const f=$('#fnova');if(f)S.draft=lerNova(f)}})}</div>
    <label>Seu nome <span class="req">*</span><input class="field" id="n_gerenteNome" name="gerenteNome" value="${esc(d.gerenteNome??p.nome??'')}"></label>
    <label>Seu e-mail <span class="req">*</span><input class="field" id="n_gerenteEmail" name="gerenteEmail" type="email" value="${esc(d.gerenteEmail??p.email??'')}" placeholder="nome@empresa.com"></label>
   </div></div>
   <div class="section full"><h3>A demanda</h3>
    <fieldset><legend>Tipo de demanda <span class="req">*</span></legend><div class="opts">${TIPOS.map((t,i)=>`<label><input type="radio" name="tipo" id="n_tipo_${i}" value="${t}" ${d.tipo===t?'checked':''}> ${t}</label>`).join('')}</div></fieldset>
    <fieldset><legend>Temas principais <span class="req">*</span></legend><div class="opts">${TEMAS.map((t,i)=>`<label><input type="checkbox" name="temas" id="n_tema_${i}" value="${t}" ${(d.temas||[]).includes(t)?'checked':''}> ${t}</label>`).join('')}</div></fieldset>
    <label id="wrapOutro" ${(d.temas||[]).includes('Outro')?'':'hidden'}>Qual outro tema?<input class="field" id="n_temaOutro" name="temaOutro" value="${v('temaOutro')}"></label>
    <label>Objetivo e descrição breve da solicitação <span class="req">*</span><textarea class="field" id="n_objetivo" name="objetivo" placeholder="Ex.: Visitar um novo cliente e prospectar outro.">${v('objetivo')}</textarea></label>
    <label>Clientes a visitar (opcional)<textarea class="field" id="n_clientesPrev" name="clientesPrev" placeholder="Nome de faturamento, cidade, contato…">${v('clientesPrev')}</textarea></label>
   </div>
   <div class="section full"><h3>Características do atendimento</h3><div>
    ${PERGUNTAS.map(([k,l])=>`<div class="yn"><span>${l}</span><div class="opts"><label><input type="radio" name="${k}" id="n_${k}_s" value="sim" ${d[k]===true?'checked':''}> Sim</label><label><input type="radio" name="${k}" id="n_${k}_n" value="nao" ${d[k]===false?'checked':''}> Não</label></div></div>`).join('')}
   </div></div>
   <div class="section full"><h3>Quando e onde</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">

   </div></div>
   <p class="ferr" id="nerr" hidden></p>
   <div class="actions"><div class="right"><button class="btn primary" type="submit" id="nsend">Enviar solicitação</button></div></div>
  </form>`;
}
function lerNova(f){
  const fd=new FormData(f),d={};
  for(const k of ['regional','distrital','gerenteNome','gerenteEmail','tipo','temaOutro','objetivo','clientesPrev','urgencia','dataSugerida','duracao','tecPref','cidadeChegada','cidadeHospedagem'])d[k]=(fd.get(k)||'').toString().trim();
  d.temas=fd.getAll('temas');
  for(const [k] of PERGUNTAS){const x=fd.get(k);d[k]=x==='sim'?true:x==='nao'?false:null}
  return d;
}
function bindNova(){
  const f=$('#fnova');if(!f)return;
  f.addEventListener('input',e=>{
    S.draft=lerNova(f);
    if(e.target.name==='temas')$('#wrapOutro').hidden=!S.draft.temas.includes('Outro');
  });
  f.addEventListener('submit',async e=>{
    e.preventDefault();const d=lerNova(f),err=$('#nerr'),falta=[];
    if(!d.regional)falta.push('Regional');if(!d.distrital)falta.push('Distrital');if(!d.gerenteNome)falta.push('Seu nome');if(!/^\S+@\S+\.\S+$/.test(d.gerenteEmail))falta.push('E-mail válido');
    if(!d.tipo)falta.push('Tipo de demanda');if(!d.temas.length)falta.push('Temas principais');if(!d.objetivo)falta.push('Objetivo');
    if(PERGUNTAS.some(([k])=>d[k]==null))falta.push('as perguntas de Sim/Não');
    if(!d.urgencia)falta.push('Urgência');if(!d.duracao)falta.push('Duração');if(!d.cidadeChegada)falta.push('Cidade de chegada');
    if(falta.length){err.textContent='Falta preencher: '+falta.join(', ')+'.';err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return}
    const b=$('#nsend');b.disabled=true;b.textContent='Enviando…';
    const doc={...d,status:'Solicitada',criadoEm:Date.now(),atualizadoEm:Date.now(),codigo:'AT-'+Date.now().toString(36).slice(-5).toUpperCase()};
    if(S.uid)doc.criadoPor=S.uid;
    try{const ref=await S.db.collection(P_SOL).add(doc);S.draft=null;S.enviado=ref.id;render();window.scrollTo(0,0)}
    catch(x){b.disabled=false;b.textContent='Enviar solicitação';err.textContent=x?.code==='invalid_argument'?'Você não tem permissão para enviar. Peça acesso de Colaborador à gestão.':'Não foi possível enviar agora. Verifique a conexão e tente de novo.';err.hidden=false}
  });
}

/* ---------- concluídas (rep e gestão) ---------- */
function inicioPer(per){
  const h=new Date();
  if(per==='mes')return hoje().slice(0,8)+'01';
  if(per==='tri'){const m=Math.floor(h.getMonth()/3)*3;return `${h.getFullYear()}-${String(m+1).padStart(2,'0')}-01`}
  if(per==='ano')return `${h.getFullYear()}-01-01`;
  if(/^\d+$/.test(per))return addDias(hoje(),-(+per-1));
  return '';
}
function linhasConcluidas(base){
  const ini=inicioPer(S.f.cper);
  let l=base.filter(s=>etapa(s)==='Concluída');
  if(S.f.creg)l=l.filter(s=>s.regional===S.f.creg);
  if(S.f.ctec)l=l.filter(s=>s.agendamento?.tecnicoId===S.f.ctec);
  if(ini)l=l.filter(s=>(s.relatorio?.fim||'')>=ini);
  const rows=[];for(const s of l){const cl=s.relatorio?.clientes||[];if(!cl.length)rows.push({s,c:null});else cl.forEach(c=>rows.push({s,c}))}
  rows.sort((a,b)=>(b.s.relatorio?.fim||'').localeCompare(a.s.relatorio?.fim||''));
  return {l,rows};
}
function telaConcluidas(base,titulo,cabecalhoExtra=''){
  const {l,rows}=linhasConcluidas(base);
  const cl=rows.filter(r=>r.c);cl.forEach(r=>r.f=fatCli(r.c,r.s));const fat=cl.reduce((t,r)=>t+(r.f||0),0);
  const segs=['A','B','C'].map(x=>{const a=cl.filter(r=>segmento(r.f)===x);return{x,n:a.length,v:a.reduce((t,r)=>t+(r.f||0),0)}});
  const semFat=cl.filter(r=>!segmento(r.f)).length;
  const c=cfg();
  return `<div class="bar"><h2>${titulo}</h2>${rows.length?`<button class="btn small" type="button" data-act="exportar">Exportar planilha</button>`:''}</div>${cabecalhoExtra}
  <div class="filters">
    <div class="seg" role="group" aria-label="Período">${[['mes','Este mês'],['tri','Trimestre'],['ano','Este ano'],['tudo','Tudo']].map(([k,lb])=>`<button type="button" data-cper="${k}" aria-pressed="${S.f.cper===k}">${lb}</button>`).join('')}</div>
    ${S.area==='gest'?cbFiltroReg('cbCReg','creg'):''}
    ${S.tec.length&&S.area!=='tec'?`<select class="field" id="fctec">${tecOpts(S.f.ctec)}</select>`:''}
  </div>
  ${!l.length?`<div class="empty"><b>Nenhum atendimento concluído neste período</b><p>Um atendimento aparece aqui quando o técnico envia o relatório, com os clientes visitados, as áreas de foco e o faturamento.</p></div>`:`
  <div class="kpis">
    <div class="kpi" style="--k:var(--s-ok)"><div class="lbl">Atendimentos concluídos</div><div class="val num">${l.length}</div><div class="sub">com relatório entregue</div></div>
    <div class="kpi" style="--k:var(--accent)"><div class="lbl">Clientes visitados</div><div class="val num">${cl.length}</div><div class="sub">${cl.filter(r=>r.c.tipo==='Prospecto'||isProsp(r.c)).length} prospectos</div></div>
    <div class="kpi" style="--k:var(--accent)"><div class="lbl">Faturamento dos visitados</div><div class="val num">${brl(fat)}</div><div class="sub">${S.vendas?'12 meses antes da visita, pela base de vendas':'anual, conforme informado'}</div></div>
    <div class="kpi" style="--k:var(--segA)"><div class="lbl">Clientes A · B · C</div><div class="val num">${segs.map(s=>s.n).join(' · ')}</div><div class="sub">${semFat} sem faturamento informado</div></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Fim</th><th>Regional / distrital</th><th>Técnico</th><th>Cliente (nome de faturamento)</th><th>Tipo</th><th>Área de foco</th><th class="r">Faturamento</th><th>Seg.</th></tr></thead><tbody>
  ${rows.map(({s,c})=>`<tr data-act="ver" data-id="${s.id}"><td class="num">${fmtD(s.relatorio?.fim)}</td><td>${esc(s.regional)}${s.distrital?'<br><span class="muted">'+esc(s.distrital)+'</span>':''}</td><td>${esc(tecNome(s.agendamento?.tecnicoId))}</td>${c?`<td><b>${esc(c.nome)}</b>${c.cidade?'<br><span class="muted">'+esc(c.cidade)+'</span>':''}</td><td>${esc(c.tipo||sitNorm(c.situacao))}</td><td>${esc(c.foco)}</td><td class="r num">${fatCli(c,s)?brl(fatCli(c,s)):'—'}</td><td>${segBadge(fatCli(c,s))}</td>`:`<td colspan="5" class="muted">${esc(s.tipo)} · sem clientes registrados</td>`}</tr>`).join('')}
  </tbody></table></div>
  <p class="mini-empty" style="margin-top:8px;font-size:.82rem">Segmentação: A a partir de ${brl(c.segA)}/ano · B a partir de ${brl(c.segB)}/ano · C abaixo disso.</p>`}`;
}
function rconc(){return telaConcluidas(minhas(),'Visitas concluídas',escopoRep())}

/* ================= EQUIPE TÉCNICA ================= */
function seletorTec(){return S.gestor?`<div class="filters"><select class="field" id="fvertec" style="max-width:320px">${tecOpts(S.verTec,'— Ver a área de qual técnico? —')}</select></div>`:''}
function doTec(){const id=meuTecId();return id?S.sol.filter(s=>s.agendamento?.tecnicoId===id&&s.status!=='Cancelada'):[]}
function semTec(){return S.gestor&&!meuTecId()?`<div class="empty"><b>Escolha um técnico</b><p>Como gestão, você pode ver a área de qualquer técnico.</p></div>`:''}
function tagenda(){
  const l=doTec().filter(s=>etapa(s)==='Agendada').sort(ordAg),pend=doTec().filter(s=>etapa(s)==='Relatório pendente');

  ${l.length?`<section class="panel"><div class="rows">${l.map(s=>solRow(s,'tec')).join('')}</div></section>`:`<div class="empty"><b>Nenhum atendimento agendado</b><p>Quando a gestão reservar uma demanda com você, ela aparece aqui com todos os detalhes da solicitação, e você recebe o e-mail de confirmação em cópia.</p></div>`}`}`;
}
function tpend(){

}
function tconc(){const id=meuTecId();if(!id)return `<div class="bar"><h2>Concluídos</h2></div>${seletorTec()}${semTec()}`;const save=S.f.ctec;S.f.ctec='';const h=telaConcluidas(doTec(),'Concluídos',seletorTec());S.f.ctec=save;return h}

/* ---------- relatório de atendimento ---------- */
function novoCliente(s){return{tipo:'',nome:'',codigo:'',cidade:'',contato:'',foco:(s?.temas||[])[0]||'',nota:''}}
function openRelatorio(id){
  const s=byId(S.sol,id);if(!s)return;
  const r=s.relatorio||{};
  S.relDraft={
    inicio:r.inicio||s.agendamento?.inicio||'',fim:r.fim||s.agendamento?.fim||s.agendamento?.inicio||'',
    clientes:(r.clientes&&r.clientes.length?r.clientes:[novoCliente(s)]).map(c=>({...c})),
    ativ:Object.assign({treinEquipe:s.treinEquipe?1:0,palestras:s.eventoExt?1:0,coops:s.revendas?1:0,eventos:0},r.ativ||{}),
    pub:Object.assign({},r.pub||{}),notaOrg:r.notaOrg??null,roteiro:r.roteiro||'',roteiroExpl:r.roteiroExpl||'',sugestoes:r.sugestoes||'',acaoGestao:!!r.acaoGestao
  };
  let dr=S.relDrafts[id];if(!dr){try{dr=JSON.parse(localStorage.getItem('cat-rel-'+id)||'null')}catch(_){}}if(dr&&!r.enviadoEm)S.relDraft=dr;
  S.relId=id;drawRel();
}
function drawRel(){
  const s=byId(S.sol,S.relId),d=S.relDraft;if(!s)return;d.pub=d.pub||{};
  const cards=d.clientes.map((c,i)=>{const pr=c.tipo==='Prospecto';const naLista=!c.nome||pr||S.clientes.some(x=>x.n===c.nome);return `<div class="ccard" data-ci="${i}">
    <div class="top"><b>Cliente ${i+1}</b>${d.clientes.length>1?`<button class="x" type="button" data-act="rdelcli" data-i="${i}" aria-label="Remover cliente ${i+1}">×</button>`:''}</div>
    <fieldset class="full"><legend>Tipo de cliente <span class="req">*</span></legend><div class="opts">${TIPOS_CLI.map((o,k)=>`<label><input type="radio" name="r_tipo_${i}" id="r_tipo_${i}_${k}" data-ctipo="${i}" value="${o}" ${c.tipo===o?'checked':''}> ${o}</label>`).join('')}</div></fieldset>
    ${!c.tipo?'':pr?`<div class="fld full"><label for="cbRP_${i}">Nome do prospecto <span class="req">*</span></label>${cb('cbRP_'+i,{kind:'prosp',livre:true,value:c.nome,placeholder:'Digite o nome ou procure um prospecto já cadastrado',onPick:v=>{const p=S.prosp.find(x=>x.nome===v);Object.assign(S.relDraft.clientes[i],{nome:v},p?{cidade:p.cidade||S.relDraft.clientes[i].cidade,contato:p.contato||S.relDraft.clientes[i].contato}:{});drawRel()}})}</div>
    <label>Cidade/UF<input class="field" id="r_cid_${i}" data-ck="cidade" value="${esc(c.cidade)}"></label>
    <label>Contato (telefone)<input class="field" id="r_ctt_${i}" data-ck="contato" type="tel" value="${esc(c.contato||'')}"></label>
    <p class="hint-box full" style="margin:0">O prospecto fica cadastrado na central. Quando ele começar a comprar, a gestão vincula o nome de faturamento oficial.</p>`
    :`<div class="fld full"><label for="cbRC_${i}">Nome de faturamento na Alta <span class="req">*</span></label>${cb('cbRC_'+i,{kind:'cli',livre:true,value:c.nome,placeholder:S.clientes.length?'Procurar cliente pelo nome de faturamento…':'Digite o nome de faturamento',onPick:v=>{const x=S.clientes.find(y=>y.n===v),dc=S.relDraft.clientes[i];dc.nome=v;dc.codigo=x?.c||'';dc.cidade=dc.cidade||'';if(x?.p?.includes('CRIA'))dc.tipo='Cliente Alta CRIA';else if(x?.p?.includes('Integra'))dc.tipo='Cliente Alta Integra';drawRel()}})}
     ${c.nome&&!naLista&&S.clientes.length?'<span class="miss" style="font-size:.8rem;color:var(--s-sol);font-weight:600">Nome não encontrado na base de clientes. Confira a grafia com a regional.</span>':''}</div>
    <label>Cidade/UF<input class="field" id="r_cid_${i}" data-ck="cidade" value="${esc(c.cidade)}"></label><span></span>`}
    <label>Área de foco da visita<select class="field" id="r_foco_${i}" data-ck="foco">${TEMAS.map(o=>`<option ${c.foco===o?'selected':''}>${o}</option>`).join('')}</select></label><span></span>
    <label class="full">Principal dificuldade e/ou oportunidade neste cliente <span class="req">*</span><textarea class="field" id="r_nota_${i}" data-ck="nota" placeholder="O que você encontrou e o que recomendou.">${esc(c.nota||'')}</textarea></label>
  </div>`}).join('');
  const html=`<div class="head"><div class="grow"><h2>Relatório de atendimento</h2><div class="chips"><span class="chip">${esc(s.codigo||'')}</span><span class="chip dot ${stCls(etapa(s))}">${etapa(s)}</span></div></div><button class="x" type="button" data-act="fechar" aria-label="Fechar">×</button></div>
  <form class="f" id="frel" novalidate>
   <div class="prefill full"><div><span>Técnico</span>${esc(tecNome(s.agendamento?.tecnicoId))}</div><div><span>Regional</span>${esc(s.regional)}</div><div><span>Distrital</span>${esc(s.distrital||'—')}</div><div><span>Solicitante</span>${esc(s.gerenteNome)}</div><div><span>Demanda</span>${esc(s.tipo)}</div></div>
   <div class="section full"><h3>Período realizado</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">
    <label>Início <span class="req">*</span><input class="field" type="date" id="r_ini" data-rk="inicio" value="${esc(d.inicio)}"></label>
    <label>Fim <span class="req">*</span><input class="field" type="date" id="r_fim" data-rk="fim" value="${esc(d.fim)}"></label></div></div>
   <div class="section full"><h3>Clientes visitados <span class="chip num">${d.clientes.length}</span></h3>
    <p class="hint-box" style="margin:0">Marque o tipo de cada cliente. Para clientes, selecione o nome de faturamento na lista (ele é cruzado com o histórico de vendas da Alta). Para prospectos, informe nome, cidade e contato.</p>

    <div><button class="btn small" type="button" data-act="raddcli">+ Adicionar cliente</button></div>

function openSol(id,modo){
  const s=byId(S.sol,id);if(!s)return;
  const a=s.agendamento,r=s.relatorio,e=etapa(s);
  const passos=[['Solicitada',fmtTs(s.criadoEm)],['Agendada',a?.agendadoEm?fmtTs(a.agendadoEm):''],['Realizada',a&&['Relatório pendente','Concluída'].includes(e)?fmtD(a.fim||a.inicio):''],['Concluída',r?.enviadoEm?fmtTs(r.enviadoEm):'']];
  const idx={Solicitada:0,Agendada:1,'Relatório pendente':2,Concluída:3}[e]??-1;
  const dl=[['Código',s.codigo],['Representante',`${s.gerenteNome}${s.gerenteEmail?' · '+s.gerenteEmail:''}`],['Telefone do representante',regInfo(s.regional)?.telefone],['Distrital',s.distrital],['Telefone do distrital',distInfo(s.distrital)?.telefone],['Tipo de demanda',s.tipo],['Temas principais',(s.temas||[]).join(', ')+(s.temaOutro?` (${s.temaOutro})`:'')],['Objetivo',s.objetivo],['Clientes a visitar',s.clientesPrev],...PERGUNTAS.map(([k,l])=>[l,sn(s[k])]),['Urgência',`${s.urgencia}${s.dataSugerida?', data sugerida '+fmtD(s.dataSugerida):''}`],['Duração estimada',s.duracao],['Técnico de preferência',s.tecPref?tecNome(s.tecPref):''],['Cidade de chegada',s.cidadeChegada],['Cidade de hospedagem',s.cidadeHospedagem]].filter(x=>x[1]);
  const gest=S.gestor,souTec=S.perfil?.papel==='tecnico'&&a?.tecnicoId===S.perfil.tecnicoId;
  let corpo='';
  if(modo==='agendar')corpo=formAgendar(s);
  else if(modo==='naoag')corpo=`<div class="box"><b>Não agendar esta solicitação</b><form class="f" id="fnaoag" data-id="${s.id}" novalidate><fieldset class="full"><legend>Motivo <span class="req">*</span></legend><div class="opts">${MOT_NAOAG.map((m,i)=>`<label><input type="radio" name="motivo" id="na_${i}" value="${m}"> ${m}</label>`).join('')}</div></fieldset><label class="full">Observação para o representante<textarea class="field" id="na_obs" name="obs" placeholder="Ex.: sugerimos remarcar para a segunda quinzena de novembro."></textarea></label><p class="ferr" id="naerr" hidden></p><div class="actions"><div class="right"><button class="btn" type="button" data-act="ver" data-id="${s.id}">Voltar</button><button class="btn primary" type="submit">Confirmar</button></div></div></form></div>`;
  else if(modo==='cancelar')corpo=`<div class="box"><b>Cancelar esta solicitação</b><form class="f" id="fcanc" data-id="${s.id}" novalidate><fieldset class="full"><legend>Cancelamento por necessidade de quem? <span class="req">*</span></legend><div class="opts">${ORIGENS.map((o,i)=>`<label><input type="radio" name="origem" id="xo_${i}" value="${o}"> ${o}</label>`).join('')}</div></fieldset><label class="full">Motivo <span class="req">*</span><textarea class="field" id="x_motivo" name="motivo"></textarea></label><p class="ferr" id="xerr" hidden></p><div class="actions"><div class="right"><button class="btn" type="button" data-act="ver" data-id="${s.id}">Voltar</button><button class="btn danger" type="submit">Confirmar cancelamento</button></div></div></form></div>`;
  else{

     +(gest&&a?.tecnicoId&&!encerrada(s)&&e!=='Concluída'?painelEmail(s):'')

     +(e==='Não agendada'?`<h3>Não agendada</h3><dl class="dl"><dt>Motivo</dt><dd>${esc(s.naoAg?.motivo||'—')}</dd>${s.naoAg?.obs?`<dt>Observação</dt><dd>${esc(s.naoAg.obs)}</dd>`:''}<dt>Decidido em</dt><dd>${fmtTs(s.naoAg?.em)}</dd><dt>Aviso por e-mail</dt><dd>${s.emailEnviadoEm?'Enviado em '+fmtTs(s.emailEnviadoEm):'Ainda não enviado'}</dd></dl>${gest?painelEmail(s,emailNaoAg(s),'E-mail ao representante'):''}`:'')
     +(e==='Cancelada'?`<h3>Cancelamento</h3><dl class="dl"><dt>Origem</dt><dd>${esc(s.cancelOrigem||'Não informada')}</dd><dt>Motivo</dt><dd>${esc(s.motivoCancelamento||'Sem motivo informado')}</dd></dl>`:'')
     +((s.reagendamentos||[]).length?`<h3>Reagendamentos <span class="chip num">${s.reagendamentos.length}</span></h3><div class="rows">${s.reagendamentos.map(r=>`<div class="row" style="cursor:default"><div class="main"><div class="t">${esc(r.origem)}</div><div class="s">${esc(r.motivo)}</div><div class="s">Antes: ${esc(tecNome(r.de?.tecnicoId))} · ${periodoCurto(r.de)}</div></div><span class="chip num">${fmtTs(r.em)}</span></div>`).join('')}</div>`:'')
     +`<h3>Solicitação</h3><dl class="dl">${dl.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  }
  sheet(`<div class="head"><div class="grow"><h2>Regional ${esc(s.regional)}${s.distrital?' · '+esc(s.distrital):''}</h2><div class="chips"><span class="chip dot ${stCls(e)}">${e}</span>${s.urgencia==='Alta'&&e==='Solicitada'?'<span class="chip urg-Alta">Urgência alta</span>':''}<span class="chip">${esc(s.codigo||'')}</span></div></div><button class="x" type="button" data-act="fechar" aria-label="Fechar">×</button></div>
   ${!encerrada(s)?`<div class="timeline">${passos.map(([n,d],i)=>`<div class="st ${i<=idx?'on':''}"><b>${n}</b>${i<=idx?d:'—'}</div>`).join('')}</div>`:''}${corpo}`);

    const ag={tecnicoId:f.elements.tecnicoId.value,inicio:f.elements.inicio.value,fim:f.elements.fim.value||f.elements.inicio.value,obs:f.elements.obs.value.trim(),agendadoEm:s.agendamento?.agendadoEm||Date.now()};

const normKey=s=>norm(s).replace(/[^a-z0-9]+/g,' ').replace(/\b(ltda|me|eireli|epp|s a|sa)\b/g,' ').replace(/\s+/g,' ').trim();

function hcod(s){let a=0x811c9dc5,b=0x5bd1e995;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);a=Math.imul(a^ch,16777619)>>>0;b=Math.imul(b^ch,16777619)>>>0}return String(a).padStart(10,'0')+String(b).padStart(10,'0')}
const normCod=s=>String(s??'').replace(/\D/g,'')||String(s??'').trim();
const ymAdd=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${String(m).padStart(2,'0')}`};
const ymDiff=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma)};
const MESN={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function parseYM(v){
  if(v==null||v==='')return'';
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`}
  const s=String(v).trim().toLowerCase();let m;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}`}
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})/)))return `${m[1]}-${String(+m[2]).padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/)))return `${m[2]}-${String(+m[1]).padStart(2,'0')}`;
  if((m=s.match(/^([a-zç]{3})[a-zç]*[\/\-. ]+(\d{2,4})$/))&&MESN[norm(m[1])]){let y=+m[2];if(y<100)y+=2000;return `${y}-${String(MESN[norm(m[1])]).padStart(2,'0')}`}
  return '';
}
function parseDia(v){
  if(v==null||v==='')return'';
  if(v instanceof Date&&!isNaN(v))return v.toLocaleDateString('sv');
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)))return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  const ym=parseYM(v);return ym?ym+'-01':'';
}
function parseValor(v){if(typeof v==='number')return v;if(v==null)return NaN;let s=String(v).replace(/[R$\s]/g,'');if(!s)return NaN;if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)}

function criaEm(c,data){const x=noIndice(S.criaIx,c);if(!x)return{x:null,st:'nao'};if(!x.d)return{x,st:x.sd&&x.sd<=data?'saiu':'semData'};if(x.d>data)return{x,st:'depois'};if(x.sd&&x.sd<=data)return{x,st:'saiu'};return{x,st:'membro'}}
const programaDe=(c,data=hoje())=>{let cr=false,ig=false;if(S.criaIx){const m=criaEm(c,data);cr=m.st==='membro'||m.st==='semData'}else cr=c.tipo==='Cliente Alta CRIA';ig=S.integraIx?!!noIndice(S.integraIx,c):c.tipo==='Cliente Alta Integra';if(cr&&ig)return'Alta CRIA + Integra';if(cr)return'Alta CRIA';if(S.integraIx){if(noIndice(S.integraIx,c))return'Alta Integra'}else if(c.tipo==='Cliente Alta Integra')return'Alta Integra';if(c.tipo==='Prospecto'||isProsp(c))return'Prospectos';return'Demais clientes Alta'};

  const vm=(dataVis||hoje()).slice(0,7),ult=S.vendas.ultimoMes||vm;
  const soma=(a,b)=>{let t=0;const ls=new Set();for(const[ym,o]of Object.entries(r.m||{})){if(ym>=a&&ym<=b&&o.t>0){t+=o.t;Object.entries(o.l||{}).forEach(([k,v])=>{if(v>0)ls.add(k)})}}return{t,ls}};

async function reconstruirClientes(){

  const naVenda=new Set();
  (S.vendas?.lista||[]).forEach(x=>{const k=normKey(x.n);const o={n:x.n};if(x.c)o.c=hcod(normCod(x.c));if(flags[k]){o.p=[...flags[k]];naVenda.add(k)}m[(o.c||'')+'|'+k]=o});
  [...(S.cria?.lista||[]),...(S.integra?.lista||[])].forEach(x=>[x.n,...(x.a||[])].forEach(n=>{const k=normKey(n);if(naVenda.has(k)||m['|'+k])return;const o={n};if(flags[k])o.p=[...flags[k]];m['|'+k]=o}));
  const lista=Object.values(m).sort((a,b)=>a.n.localeCompare(b.n,'pt-BR'));
  const T=3000,partes=Math.ceil(lista.length/T);const antes=(await S.db.collection('cad/clientes/partes').limit(100).get()).docs.length;
  for(let p=0;p<partes;p++)await S.db.collection('cad/clientes/partes').doc('c'+p).set({lista:lista.slice(p*T,(p+1)*T)});
  for(let p=partes;p<antes;p++)await S.db.collection('cad/clientes/partes').doc('c'+p).delete();
  await S.db.doc('cad/clientes').set({partes,total:lista.length,atualizadoEm:Date.now()});
}
