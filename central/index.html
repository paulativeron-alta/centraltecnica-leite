<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17305C">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icones/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="../config.js"></script>
<script src="../core/alta.js"></script>
<script>if(!ALTA.guarda())document.documentElement.style.display='none';</script>
<title>Central de Atendimento Técnico de Leite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: service desk — sticky header with role-aware tabs; summary first, then lists; sheets for detail, scheduling and closing */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --ink:#141c26; --muted:#566273; --line:#d7dee7;
  --accent:#1f5a85; --accent-ink:#ffffff; --soft:#dde8f2;
  --s-sol:#9a5b06; --s-sol-bg:#fbedd5; --s-ag:#1f5a85; --s-ag-bg:#dde8f2; --s-ok:#1f7448; --s-ok-bg:#dcf0e4; --s-x:#6b7480; --s-x-bg:#e6e9ee;
  --bad:#b3261e; --bad-bg:#f9dedb;
  --segA:#1f7448; --segB:#1f5a85; --segC:#9a5b06; --c1:#2f6db0; --c2:#c4661f; --c3:#7a5bb5;
  --shadow:0 1px 2px rgb(15 30 50 / .06),0 10px 30px rgb(15 30 50 / .10);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131a; --surface:#151d27; --sunk:#10171f; --ink:#e3e9f0; --muted:#97a3b3; --line:#283442;
  --accent:#7db7e3; --accent-ink:#0b1622; --soft:#1a2b3b;
  --s-sol:#f1b25e; --s-sol-bg:#33240f; --s-ag:#7db7e3; --s-ag-bg:#16283a; --s-ok:#6fd39c; --s-ok-bg:#163022; --s-x:#9aa4b0; --s-x-bg:#1e2630;
  --bad:#f2847a; --bad-bg:#371815;
  --segA:#6fd39c; --segB:#7db7e3; --segC:#f1b25e; --c1:#5b95d4; --c2:#c97a3a; --c3:#9a7fd6;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131a; --surface:#151d27; --sunk:#10171f; --ink:#e3e9f0; --muted:#97a3b3; --line:#283442;
  --accent:#7db7e3; --accent-ink:#0b1622; --soft:#1a2b3b;
  --s-sol:#f1b25e; --s-sol-bg:#33240f; --s-ag:#7db7e3; --s-ag-bg:#16283a; --s-ok:#6fd39c; --s-ok-bg:#163022; --s-x:#9aa4b0; --s-x-bg:#1e2630;
  --bad:#f2847a; --bad-bg:#371815;
  --segA:#6fd39c; --segB:#7db7e3; --segC:#f1b25e; --c1:#5b95d4; --c2:#c97a3a; --c3:#9a7fd6;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.brand .grow{flex:1;min-width:160px}
.role{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px 11px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--s-sol-bg);color:var(--s-sol);font-size:.74rem;font-weight:700;text-align:center}

main{padding-block:20px 90px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:1.4rem;flex:1;min-width:180px;font-weight:800;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.92rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .field{flex:1 1 170px;width:auto}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--k,var(--line))}
.kpi .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .val{font-family:var(--f-display);font-size:1.8rem;font-weight:800;line-height:1.2;margin-top:4px}
.kpi .sub{font-size:.84rem;color:var(--muted)}

.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cols3{grid-template-columns:minmax(0,1fr)}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:700}
.panel h3 .hint{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:auto}

.rows{display:grid}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0;padding-top:2px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row:hover .t{color:var(--accent)}
.row .s{color:var(--muted);font-size:.86rem}
.row .end{display:grid;justify-items:end;gap:4px;text-align:right}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:none}
.st-Solicitada{background:var(--s-sol-bg);color:var(--s-sol)}
.st-Agendada{background:var(--s-ag-bg);color:var(--s-ag)}
.st-Concluída{background:var(--s-ok-bg);color:var(--s-ok)}
.st-Cancelada{background:var(--s-x-bg);color:var(--s-x)}
.st-NaoAg{background:var(--s-x-bg);color:var(--ink);outline:1px dashed var(--s-x);outline-offset:-1px}
.chip.dot::before{display:block}
.chip.urg-Alta{background:var(--bad-bg);color:var(--bad)}
.segA,.segB,.segC{font-family:var(--f-display);font-weight:800;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-size:.85rem;border:1.5px solid currentColor}
.segA{color:var(--segA)}.segB{color:var(--segB)}.segC{color:var(--segC)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:820px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}

.hbar{display:grid;grid-template-columns:minmax(70px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:.9rem}
.hbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:6px}
.hbar .v{font-weight:700;text-align:right}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:1.02rem}
.empty p{margin:0;max-width:56ch}
.mini-empty{color:var(--muted);font-size:.9rem;margin:0}
.notice{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;background:var(--soft);color:var(--accent)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

/* form */
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){form.f{grid-template-columns:minmax(0,1fr)}}
form.f .full{grid-column:1/-1}
form.f label,form.f fieldset{display:grid;gap:5px;font-size:.86rem;font-weight:600;color:var(--muted)}
form.f fieldset{border:0;padding:0;margin:0}
form.f legend{padding:0;margin-bottom:5px}
form.f textarea{min-height:84px;resize:vertical}
.req{color:var(--bad)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:500;color:var(--ink);cursor:pointer;background:var(--surface);font-size:.9rem}
.opts label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.opts input{accent-color:var(--accent);margin:0}
.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);color:var(--ink);font-weight:500;font-size:.92rem}
.yn:first-of-type{border-top:0}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.section h3{font-size:1rem;font-weight:700;color:var(--ink)}
.actions{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.ferr{grid-column:1/-1;margin:0;color:var(--bad);font-size:.9rem;font-weight:600}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgb(8 16 26 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.backdrop{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sheet .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet .head .grow{flex:1;min-width:0}
.sheet .head h2{font-size:1.25rem;font-weight:800}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.sheet h3{font-size:.98rem;margin:20px 0 8px;font-weight:700}
.dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:7px 16px;font-size:.92rem;margin:0}
@media (max-width:520px){.dl{grid-template-columns:minmax(0,1fr)}.dl dd{margin-bottom:6px}}
.dl dt{color:var(--muted)}
.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
.timeline{display:flex;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.timeline .st{flex:1 1 120px;padding:8px 10px;border-top:3px solid var(--line);font-size:.82rem;color:var(--muted)}
.timeline .st b{display:block;color:var(--ink);font-size:.86rem}
.timeline .st.on{border-top-color:var(--accent)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--sunk);display:grid;gap:10px}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.9rem;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.mailhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.88rem}
.mailhead span:nth-child(odd){color:var(--muted)}
.mailhead span{word-break:break-all}
.cli{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.4fr) auto auto;gap:6px;align-items:center}
@media (max-width:700px){.cli{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cli .seghold,.cli .del{justify-self:start}}
.cli-head{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
@media (max-width:700px){.cli-head{display:none}}
.cli-row{padding:8px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.done-card{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 20px}
.done-card .ok{width:52px;height:52px;border-radius:50%;background:var(--s-ok-bg);color:var(--s-ok);display:grid;place-items:center;font-size:1.6rem;font-weight:800}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<style>
.areas{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.areas button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.areas button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.who b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:.84rem;text-decoration:underline;text-underline-offset:2px}
.bk{display:grid;gap:2px}
.bk .r{display:grid;grid-template-columns:minmax(0,1fr) 44px 52px;gap:10px;align-items:center;font-size:.88rem;padding:5px 0;border-top:1px solid var(--line)}
.bk .r:first-child{border-top:0}
.bk .lab{min-width:0}
.bk .lab span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .lab i{display:block;height:5px;border-radius:3px;background:var(--accent);margin-top:4px;opacity:.85}
.bk .n,.bk .p{text-align:right;font-weight:700}
.bk .p{color:var(--muted);font-weight:600}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.funnel div{background:var(--sunk);border-radius:8px;padding:10px 12px}
.funnel b{display:block;font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.funnel span{font-size:.8rem;color:var(--muted)}
.funnel.f6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:900px){.funnel.f6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.funnel.f6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.funnel small{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.funnel em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--accent)}
.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.delta{font-size:.78rem;font-weight:700}
.delta.up{color:var(--s-ok)}.delta.down{color:var(--bad)}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-size:1.05rem}
.counter input{width:64px;text-align:center}
.ativ{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem;color:var(--ink);font-weight:500}
.ativ:first-child{border-top:0}
.nota{display:flex;gap:4px;flex-wrap:wrap}
.nota label{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;font-weight:700;color:var(--ink);background:var(--surface)}
.nota label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nota input{position:absolute;opacity:0;pointer-events:none}
.nota-scale{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);max-width:460px}
.ccard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ccard{grid-template-columns:minmax(0,1fr)}}
.ccard .full{grid-column:1/-1}
.ccard .top{display:flex;align-items:center;gap:8px;grid-column:1/-1}
.ccard .top b{flex:1;font-family:var(--f-display)}
.hint-box{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.prefill{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;font-size:.88rem;background:var(--sunk);border-radius:8px;padding:10px 14px}
.prefill span{color:var(--muted);display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.st-Pendente{background:var(--bad-bg);color:var(--bad)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:4px}

<script>
(function(){
/* ================= constantes ================= */
const P_SOL='solicitacoes',P_TEC='cad/config/tecnicos',P_EST='cad/estrutura',P_CFG='cad/config';
const TIPOS=['Visita técnica presencial','Atendimento remoto / online','Treinamento de equipe','Palestra ou evento'];

const PERGUNTAS=[
 ['revendas','Atendimento de Revendas, cooperativas, laticínios e/ou prefeituras?','Revendas / cooperativas / laticínios / prefeituras'],
 ['altaCria','Atendimento em Alta CRIA?','Alta CRIA'],
 ['advantage','Atendimento em Advantage ou Alta Integra?','Advantage / Alta Integra'],
 ['treinEquipe','Treinamento de Equipe Alta?','Treinamento de equipe Alta'],
 ['eventoExt','Treinamento, palestra ou participação em evento externo?','Evento externo']
];
const URG=['Baixa','Média','Alta'];
const SITUACOES=['Cliente com faturamento','Cliente prospectado (ainda não compra da Alta)','Cliente recuperado (sem faturamento há mais de 1 ano)'];
const sitNorm=x=>/prospect/i.test(x||'')?SITUACOES[1]:/recuperado/i.test(x||'')?SITUACOES[2]:SITUACOES[0];
const isProsp=c=>/prospect/i.test(c.situacao||'');
const PUB={treinEquipe:'pessoas treinadas',palestras:'pessoas no público',eventos:'clientes atendidos'};

const ATIV=[['treinEquipe','Treinamentos da equipe Alta'],['palestras','Treinamentos ou palestras externas'],['coops','Visitas a cooperativas e/ou revendas'],['eventos','Participações em eventos, julgamentos ou feiras']];
const CFG_PADRAO={segA:300000,segB:100000,prazoRel:3,metaAceite:90,metaVisita:80,metaRel:90,metaCanc:10,metaNaoAg:10,ocupMin:60,ocupMax:80,assinatura:'Dra. Paula Tiveron\nCoordenadora de Produtos e Serviços Leite'};

const TABS={
  rep:[['rinicio','Início'],['nova','Solicitar agenda'],['disp','Disponibilidade'],['rlista','Minhas solicitações'],['rconc','Visitas concluídas']],
  tec:[['tinicio','Início'],['tagenda','Minha agenda'],['tpend','Relatórios pendentes'],['tconc','Concluídos'],['nova','Solicitar agenda'],['disp','Disponibilidade']],
  gest:[['gvisao','Visão geral'],['gsol','<i>1</i>Solicitações'],['gagt','<i>2</i>Agenda Técnica'],['grel2','<i>3</i>Relatórios'],['gdados','<i>4</i>Dados e backup']]
};

const S={sol:[],tec:[],reg:[],dist:[],cfg:{},perfil:null,loaded:{},gestor:false,canWrite:true,uid:null,db:null,dbState:'loading',
  area:null,tab:null,verTec:'',relDrafts:{},pc:{},clientes:[],prosp:[],vendas:null,vendasMeta:null,cria:null,integra:null,criaIx:null,integraIx:null,f:{reg:'',dist:'',st:'Todas',q:'',per:'30',creg:'',ctec:'',cper:'ano',rtodas:false,cadq:'',trend:'mes'},draft:null};

if(AREA_URL){S.area=AREA_URL;S.tab=new URLSearchParams(location.search).get('tab')||null;try{history.replaceState(null,'',location.pathname)}catch(_){}}

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>new Date().toLocaleDateString('sv');
const addDias=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('sv')};

const tsDia=t=>t?new Date(t).toLocaleDateString('sv'):'';
const fmtD=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};

const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const pct=(n,t)=>t?Math.round(n/t*100)+'%':'—';

const sortN=a=>[...a].sort((x,y)=>(x.nome||'').localeCompare(y.nome||'','pt-BR'));

function periodoAg(a){

  const [yi,mi,di]=i.split('-'),[yf,mf,df]=f.split('-');

/* etapa: Solicitada → Agendada → Relatório pendente → Concluída (só com relatório) */
function etapa(s){
  if(s.status==='Cancelada')return'Cancelada';
  if(s.status==='Não agendada')return'Não agendada';
  if(s.relatorio?.enviadoEm)return'Concluída';
  if(typeof dispensaRel==='function'&&dispensaRel(s))return'Concluída';
  if(s.agendamento?.tecnicoId){const fim=s.agendamento.fim||s.agendamento.inicio;return hoje()>=fim?'Relatório pendente':'Agendada'}
  return'Solicitada';
}

const MOT_NAOAG=['Sem técnico disponível no período','Fora dos objetivos da equipe técnica','Solicitação duplicada','Outro motivo'];
const MOT_TROCA=['Técnico sugerido sem agenda no período','Outro técnico mais indicado para o tema','Outro motivo'];
const encerrada=s=>s.status==='Cancelada'||s.status==='Não agendada';
const stCls=e=>e==='Relatório pendente'?'st-Pendente':e==='Não agendada'?'st-NaoAg':'st-'+e;
const atrasoRel=s=>{const fim=s.agendamento?.fim||s.agendamento?.inicio;return fim?difDias(fim,hoje())-cfg().prazoRel:0};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const CBS={},CB={id:null,act:0,items:[]};
const ICO_BUSCA='<svg class="cb-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
function cbOptions(c){
  if(c.kind==='cli'){if(S._cliO?.src!==S.clientes)S._cliO={src:S.clientes,o:S.clientes.map(x=>{const s=(x.p||[]).map(p=>'Alta '+p).join(' · ');return{v:x.n,l:x.n,s,q:norm(x.n+' '+s)}})};return S._cliO.o}
  if(c.kind==='prosp')return sortN(S.prosp).map(p=>({v:p.nome,l:p.nome,s:[p.cidade,p.regional].filter(Boolean).join(' · ')}));
  if(c.kind==='tec')return sortN(S.tec).map(t=>({v:t.nome,l:t.nome,s:t.cidadeBase||''}));
  if(c.kind==='gp')return sortN(S.gp||[]).map(g=>({v:g.nome,l:g.nome,s:g.cidade||''}));
  if(c.kind==='dist')return sortN(S.dist).map(d=>{const n=S.reg.filter(r=>r.distrital===d.nome).length;return{v:d.nome,l:d.nome,s:`${n} regiona${n===1?'l':'is'}`}});

function cb(id,o){
  CBS[id]=o;const v=o.value||'';
  return `<div class="cb" data-cb="${id}" data-value="${esc(v)}">${ICO_BUSCA}<input class="field cb-in" id="${id}" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}_lb" autocomplete="off" spellcheck="false" placeholder="${esc(o.placeholder||'Procurar…')}" value="${esc(v)}">${o.name?`<input type="hidden" name="${o.name}" value="${esc(v)}">`:''}<button type="button" class="cb-x" data-cbclear="${id}" aria-label="Limpar seleção" ${v?'':'hidden'}>×</button><div class="cb-list" id="${id}_lb" role="listbox" hidden></div></div>`;
}
const cbEl=id=>document.querySelector(`.cb[data-cb="${id}"]`);
function cbSet(id,v){const w=cbEl(id);if(!w)return;v=v||'';w.dataset.value=v;w.querySelector('.cb-in').value=v;const h=w.querySelector('input[type=hidden]');if(h)h.value=v;w.querySelector('.cb-x').hidden=!v}
function cbOpen(id,q){
  const w=cbEl(id),c=CBS[id];if(!w||!c)return;
  const toks=norm(q).split(/\s+/).filter(Boolean);
  let it=cbOptions(c).filter(o=>{const q=o.q||norm(o.l+' '+o.s);return toks.every(t=>q.includes(t))});
  if(toks.length){const t0=toks.join(' ');it.sort((a,b)=>(norm(b.l).includes(t0)?1:0)-(norm(a.l).includes(t0)?1:0))}
  const total=it.length;it=it.slice(0,80);
  if(c.allLabel&&!toks.length)it.unshift({v:'',l:c.allLabel,s:''});
  CB.id=id;CB.items=it;const cur=w.dataset.value;
  CB.act=toks.length?0:Math.max(0,it.findIndex(o=>o.v===cur));
  const lb=w.querySelector('.cb-list');
  lb.innerHTML=it.length?it.map((o,i)=>`<div class="cb-opt" role="option" id="${id}_o${i}" data-i="${i}" aria-selected="${o.v===cur&&!!cur}"><b>${esc(o.l)}</b>${o.s?`<span>${esc(o.s)}</span>`:''}</div>`).join('')+(total>80?`<div class="cb-foot">Mostrando 80 de ${total}. Continue digitando para filtrar.</div>`:''):`<div class="cb-foot">Nada encontrado para “${esc(q)}”.</div>`;
  lb.hidden=false;w.querySelector('.cb-in').setAttribute('aria-expanded','true');cbAct(CB.act,!toks.length);
}
function cbAct(i,scroll=true){const w=cbEl(CB.id);if(!w)return;CB.act=i;w.querySelectorAll('.cb-opt').forEach((el,k)=>el.classList.toggle('on',k===i));const el=document.getElementById(`${CB.id}_o${i}`),inp=w.querySelector('.cb-in');if(el){inp.setAttribute('aria-activedescendant',el.id);if(scroll)el.scrollIntoView({block:'nearest'})}else inp.removeAttribute('aria-activedescendant')}
function cbClose(id,revert=true){const w=cbEl(id);if(w){w.querySelector('.cb-list').hidden=true;const i=w.querySelector('.cb-in');i.setAttribute('aria-expanded','false');i.removeAttribute('aria-activedescendant');if(revert)i.value=w.dataset.value||''}if(CB.id===id)CB.id=null}
function cbPick(id,v){const c=CBS[id];cbSet(id,v);cbClose(id,false);const i=cbEl(id)?.querySelector('.cb-in');if(i&&document.activeElement===i)i.blur();c?.onPick?.(v)}
document.addEventListener('focusin',e=>{const i=e.target.closest?.('.cb-in');if(!i)return;try{i.select()}catch(_){}cbOpen(i.id,'')},true);
document.addEventListener('input',e=>{const i=e.target.closest?.('.cb-in');if(!i)return;const w=cbEl(i.id);if(w)w.querySelector('.cb-x').hidden=true;cbOpen(i.id,i.value)},true);
document.addEventListener('keydown',e=>{const i=e.target.closest?.('.cb-in');if(!i)return;const open=CB.id===i.id;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)return cbOpen(i.id,'');const n=CB.items.length;if(n)cbAct((CB.act+(e.key==='ArrowDown'?1:-1)+n)%n)}
  else if(e.key==='Enter'){e.preventDefault();if(open&&CB.items[CB.act]&&(!CBS[i.id]?.livre||norm(CB.items[CB.act].l).includes(norm(i.value))))cbPick(i.id,CB.items[CB.act].v);else if(CBS[i.id]?.livre&&i.value.trim())cbPick(i.id,i.value.trim())}
  else if(e.key==='Escape'&&open){e.preventDefault();cbClose(i.id)}
  else if(e.key==='Tab'&&open){const w=cbEl(i.id);if(CBS[i.id]?.livre&&i.value.trim()&&i.value.trim()!==w?.dataset.value)cbPick(i.id,i.value.trim());else cbClose(i.id)}
},true);
document.addEventListener('mousedown',e=>{if(e.target.closest?.('.cb-list'))e.preventDefault()},true);
document.addEventListener('click',e=>{const o=e.target.closest?.('.cb-opt');if(o){const w=o.closest('.cb'),it=CB.id===w.dataset.cb?CB.items[+o.dataset.i]:null;if(it)cbPick(w.dataset.cb,it.v);return}const x=e.target.closest?.('[data-cbclear]');if(x)cbPick(x.dataset.cbclear,'')},true);
document.addEventListener('focusout',e=>{const i=e.target.closest?.('.cb-in');if(!i)return;const id=i.id;setTimeout(()=>{if(!i.isConnected||document.activeElement===i)return;const w=cbEl(id);if(w&&!i.value.trim()&&w.dataset.value)cbPick(id,'');else if(w&&CBS[id]?.livre&&i.value.trim()&&i.value.trim()!==w.dataset.value)cbPick(id,i.value.trim());else cbClose(id);if(S.renderPending){S.renderPending=false;render()}},150)},true);

function filtroLista(l){

  const ord={Solicitada:0,'Relatório pendente':1,Agendada:2,Concluída:3,'Não agendada':4,Cancelada:5};
  return [...l].sort((a,b)=>ord[etapa(a)]-ord[etapa(b)]||(b.criadoEm||0)-(a.criadoEm||0));

function lerNova(f){
  const fd=new FormData(f),d={};
  for(const k of ['regional','distrital','gerenteNome','gerenteEmail','tipo','temaOutro','objetivo','clientesPrev','urgencia','dataSugerida','duracao','tecPref','cidadeChegada','cidadeHospedagem'])d[k]=(fd.get(k)||'').toString().trim();
  d.temas=fd.getAll('temas');
  for(const [k] of PERGUNTAS){const x=fd.get(k);d[k]=x==='sim'?true:x==='nao'?false:null}
  return d;
}
function bindNova(){
  const f=$('#fnova');if(!f)return;
  f.addEventListener('input',e=>{
    S.draft=lerNova(f);
    if(e.target.name==='temas')$('#wrapOutro').hidden=!S.draft.temas.includes('Outro');
  });
  f.addEventListener('submit',async e=>{
    e.preventDefault();const d=lerNova(f),err=$('#nerr'),falta=[];
    if(!d.regional)falta.push('Regional');if(!d.distrital)falta.push('Distrital');if(!d.gerenteNome)falta.push('Seu nome');if(!/^\S+@\S+\.\S+$/.test(d.gerenteEmail))falta.push('E-mail válido');
    if(!d.tipo)falta.push('Tipo de demanda');if(!d.temas.length)falta.push('Temas principais');if(!d.objetivo)falta.push('Objetivo');
    if(PERGUNTAS.some(([k])=>d[k]==null))falta.push('as perguntas de Sim/Não');
    if(!d.urgencia)falta.push('Urgência');if(!d.duracao)falta.push('Duração');if(!d.cidadeChegada)falta.push('Cidade de chegada');
    if(falta.length){err.textContent='Falta preencher: '+falta.join(', ')+'.';err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return}
    const b=$('#nsend');b.disabled=true;b.textContent='Enviando…';
    const doc={...d,status:'Solicitada',criadoEm:Date.now(),atualizadoEm:Date.now(),codigo:'AT-'+Date.now().toString(36).slice(-5).toUpperCase()};
    if(S.uid)doc.criadoPor=S.uid;
    try{const ref=await S.db.collection(P_SOL).add(doc);S.draft=null;S.enviado=ref.id;render();window.scrollTo(0,0)}
    catch(x){b.disabled=false;b.textContent='Enviar solicitação';err.textContent=x?.code==='invalid_argument'?'Você não tem permissão para enviar. Peça acesso de Colaborador à gestão.':'Não foi possível enviar agora. Verifique a conexão e tente de novo.';err.hidden=false}
  });
}

/* ---------- concluídas (rep e gestão) ---------- */
function inicioPer(per){
  const h=new Date();
  if(per==='mes')return hoje().slice(0,8)+'01';
  if(per==='tri'){const m=Math.floor(h.getMonth()/3)*3;return `${h.getFullYear()}-${String(m+1).padStart(2,'0')}-01`}
  if(per==='ano')return `${h.getFullYear()}-01-01`;
  if(/^\d+$/.test(per))return addDias(hoje(),-(+per-1));
  return '';
}
function linhasConcluidas(base){
  const ini=inicioPer(S.f.cper);
  let l=base.filter(s=>etapa(s)==='Concluída');
  if(S.f.creg)l=l.filter(s=>s.regional===S.f.creg);
  if(S.f.ctec)l=l.filter(s=>s.agendamento?.tecnicoId===S.f.ctec);
  if(ini)l=l.filter(s=>(s.relatorio?.fim||'')>=ini);
  const rows=[];for(const s of l){const cl=s.relatorio?.clientes||[];if(!cl.length)rows.push({s,c:null});else cl.forEach(c=>rows.push({s,c}))}
  rows.sort((a,b)=>(b.s.relatorio?.fim||'').localeCompare(a.s.relatorio?.fim||''));
  return {l,rows};
}
function telaConcluidas(base,titulo,cabecalhoExtra=''){

  const segs=['A','B','C'].map(x=>{const a=cl.filter(r=>segmento(r.f)===x);return{x,n:a.length,v:a.reduce((t,r)=>t+(r.f||0),0)}});
  const semFat=cl.filter(r=>!segmento(r.f)).length;
  const c=cfg();
  return `<div class="bar"><h2>${titulo}</h2>${rows.length?`<button class="btn small" type="button" data-act="exportar">Exportar planilha</button>`:''}</div>${cabecalhoExtra}
  <div class="filters">
    <div class="seg" role="group" aria-label="Período">${[['mes','Este mês'],['tri','Trimestre'],['ano','Este ano'],['tudo','Tudo']].map(([k,lb])=>`<button type="button" data-cper="${k}" aria-pressed="${S.f.cper===k}">${lb}</button>`).join('')}</div>
    ${S.area==='gest'?cbFiltroReg('cbCReg','creg'):''}
    ${S.tec.length&&S.area!=='tec'?`<select class="field" id="fctec">${tecOpts(S.f.ctec)}</select>`:''}
  </div>
  ${!l.length?`<div class="empty"><b>Nenhum atendimento concluído neste período</b><p>Um atendimento aparece aqui quando o técnico envia o relatório, com os clientes visitados, as áreas de foco e o faturamento.</p></div>`:`
  <div class="kpis">
    <div class="kpi" style="--k:var(--s-ok)"><div class="lbl">Atendimentos concluídos</div><div class="val num">${l.length}</div><div class="sub">com relatório entregue</div></div>
    <div class="kpi" style="--k:var(--accent)"><div class="lbl">Clientes visitados</div><div class="val num">${cl.length}</div><div class="sub">${cl.filter(r=>r.c.tipo==='Prospecto'||isProsp(r.c)).length} prospectos</div></div>
    <div class="kpi" style="--k:var(--accent)"><div class="lbl">Faturamento dos visitados</div><div class="val num">${brl(fat)}</div><div class="sub">${S.vendas?'12 meses antes da visita, pela base de vendas':'anual, conforme informado'}</div></div>
    <div class="kpi" style="--k:var(--segA)"><div class="lbl">Clientes A · B · C</div><div class="val num">${segs.map(s=>s.n).join(' · ')}</div><div class="sub">${semFat} sem faturamento informado</div></div>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Fim</th><th>Regional / distrital</th><th>Técnico</th><th>Cliente (nome de faturamento)</th><th>Tipo</th><th>Área de foco</th><th class="r">Faturamento</th><th>Seg.</th></tr></thead><tbody>
  ${rows.map(({s,c})=>`<tr data-act="ver" data-id="${s.id}"><td class="num">${fmtD(s.relatorio?.fim)}</td><td>${esc(s.regional)}${s.distrital?'<br><span class="muted">'+esc(s.distrital)+'</span>':''}</td><td>${esc(tecNome(s.agendamento?.tecnicoId))}</td>${c?`<td><b>${esc(c.nome)}</b>${c.cidade?'<br><span class="muted">'+esc(c.cidade)+'</span>':''}</td><td>${esc(c.tipo||sitNorm(c.situacao))}</td><td>${esc(c.foco)}</td><td class="r num">${fatCli(c,s)?brl(fatCli(c,s)):'—'}</td><td>${segBadge(fatCli(c,s))}</td>`:`<td colspan="5" class="muted">${esc(s.tipo)} · sem clientes registrados</td>`}</tr>`).join('')}
  </tbody></table></div>
  <p class="mini-empty" style="margin-top:8px;font-size:.82rem">Segmentação: A a partir de ${brl(c.segA)}/ano · B a partir de ${brl(c.segB)}/ano · C abaixo disso.</p>`}`;
}

}

function gagenda(){

  const grupos=sortN(S.tec).map(t=>({t,l:l.filter(s=>s.agendamento?.tecnicoId===t.id)})).filter(g=>g.l.length);
  return `<div class="bar"><h2>Agenda técnica</h2></div>${filtrosGest(false)}
  ${!l.length?`<div class="empty"><b>Nenhum atendimento agendado</b><p>As demandas aceitas aparecem aqui, separadas por técnico.</p></div>`:
  `<div class="grid2">${grupos.map(g=>`<section class="panel"><h3>${esc(g.t.nome)}<span class="hint">${g.l.length}</span></h3><div class="rows">${g.l.map(s=>`<div class="row" data-act="ver" data-id="${s.id}" role="button" tabindex="0"><div class="main"><div class="t num">${periodoCurto(s.agendamento)}</div><div class="s">Regional ${esc(s.regional)}${s.distrital?' · '+esc(s.distrital):''} · ${esc(s.cidadeChegada)}</div><div class="s">${esc(s.gerenteNome)} · ${(s.temas||[]).map(esc).join(', ')}</div></div><span class="chip dot ${stCls(etapa(s))}">${etapa(s)==='Relatório pendente'?(atrasoRel(s)>0?atrasoRel(s)+'d atraso':'Relatório'):'Agendada'}</span></div>`).join('')}</div></section>`).join('')}</div>`}`;

function grel(){
  const pend=filtroGest(S.sol).filter(s=>etapa(s)==='Relatório pendente').sort((a,b)=>atrasoRel(b)-atrasoRel(a));
  const cab=`<section class="panel" style="margin-bottom:16px"><h3>Aguardando relatório do técnico<span class="hint">${pend.length}</span></h3>${pend.length?`<div class="rows">${pend.map(s=>`<div class="row" data-act="ver" data-id="${s.id}" role="button" tabindex="0"><div class="main"><div class="t">${esc(tecNome(s.agendamento?.tecnicoId))}</div><div class="s">${periodoCurto(s.agendamento)} · Regional ${esc(s.regional)} · ${esc(s.cidadeChegada)}</div></div>${atrasoRel(s)>0?`<span class="chip urg-Alta">${atrasoRel(s)}d de atraso</span>`:'<span class="chip dot st-Pendente">No prazo</span>'}</div>`).join('')}</div>`:'<p class="mini-empty">Nenhum relatório pendente.</p>'}</section>`;
  const fl=[];filtroGest(S.sol).filter(s=>etapa(s)==='Concluída').forEach(s=>(s.relatorio?.clientes||[]).forEach((c,i)=>fl.push({s,c,i})));
  fl.sort((a,b)=>((a.c.fatDepois!=null)-(b.c.fatDepois!=null))||(a.s.relatorio?.fim||'').localeCompare(b.s.relatorio?.fim||''));
  const semFp=fl.filter(x=>x.c.fatDepois==null).length;
  const fp=`<section class="panel" style="margin-bottom:16px" id="fatpos"><h3>Faturamento pós-visita<span class="hint">${semFp} cliente${semFp===1?'':'s'} sem atualização</span></h3>
   <p class="mini-empty" style="margin:-4px 0 10px;font-size:.86rem">Lance o faturamento anual do cliente depois da visita (por exemplo, 12 meses após o atendimento). A comparação com o faturamento antes da visita aparece em Indicadores.</p>
   ${fl.length?`<div class="tablewrap"><table style="min-width:820px"><thead><tr><th>Visita</th><th>Cliente</th><th>Regional</th><th class="r">Antes da visita</th><th>Depois da visita (R$/ano)</th><th class="r">Variação</th><th></th></tr></thead><tbody>${fl.slice(0,80).map(({s,c,i})=>{const v=c.fatDepois!=null&&c.faturamento?Math.round((c.fatDepois-c.faturamento)/c.faturamento*100):null;return `<tr style="cursor:default" data-fp="${s.id}" data-i="${i}"><td class="num">${fmtD(s.relatorio?.fim)}</td><td><b>${esc(c.nome)}</b></td><td>${esc(s.regional)}</td><td class="r num">${c.faturamento?brl(c.faturamento):'—'}</td><td><input class="field num" id="fp_${s.id}_${i}" type="number" min="0" step="any" inputmode="decimal" style="max-width:180px" value="${c.fatDepois??''}" aria-label="Faturamento depois da visita de ${esc(c.nome)}"></td><td class="r num">${v==null?'—':`<span class="delta ${v>=0?'up':'down'}">${v>=0?'▲':'▼'} ${Math.abs(v)}%</span>`}</td><td><button class="btn small" type="button" data-act="fpsave">Salvar</button></td></tr>`}).join('')}</tbody></table></div>${fl.length>80?`<p class="mini-empty" style="font-size:.82rem;margin-top:6px">Mostrando 80 de ${fl.length}. Os sem atualização aparecem primeiro.</p>`:''}`:'<p class="mini-empty">Nenhum atendimento concluído ainda.</p>'}</section>`;
  return telaConcluidas(filtroGest(S.sol),'Relatórios de atendimento',filtrosGest(false)+cab);
}

    <div class="pclist">${pend.map((r,i)=>{const dr=S.pc[r.nome]||{};const falta=[!r.email&&'e-mail',!r.telefone&&'telefone'].filter(Boolean).join(' e ');return `<div class="pcrow" data-pc="${esc(r.nome)}"><div style="min-width:0"><div class="t">${esc(r.nome)}</div><div class="s">${esc(r.representante||'Sem representante')} · <span class="miss">falta ${falta}</span></div></div>
     <input class="field" id="pc_e_${i}" type="email" data-pck="email" placeholder="E-mail do representante" aria-label="E-mail do representante de ${esc(r.nome)}" value="${esc(dr.email??r.email??'')}">
     <input class="field" id="pc_t_${i}" type="tel" data-pck="telefone" placeholder="(00) 00000-0000" aria-label="Telefone do representante de ${esc(r.nome)}" value="${esc(dr.telefone??r.telefone??'')}">
     <button class="btn small primary" type="button" data-act="pcsave">Salvar</button></div>`}).join('')}</div></section>`})()}
   <section class="panel"><h3>Regras da central</h3>
    <form class="f" id="fcfg" novalidate>
     <label>Cliente A a partir de (R$/ano)<input class="field num" type="number" min="0" step="1000" id="c_segA" name="segA" value="${c.segA}"></label>
     <label>Cliente B a partir de (R$/ano)<input class="field num" type="number" min="0" step="1000" id="c_segB" name="segB" value="${c.segB}"></label>
     <label>Prazo do relatório (dias após a visita)<input class="field num" type="number" min="0" max="30" id="c_prazo" name="prazoRel" value="${c.prazoRel}"></label>
     <span></span>
     <label>Meta: agendamento em até 1 semana (%)<input class="field num" type="number" min="0" max="100" id="c_mA" name="metaAceite" value="${c.metaAceite}"></label>
     <label>Meta: visita até a data sugerida (%)<input class="field num" type="number" min="0" max="100" id="c_mV" name="metaVisita" value="${c.metaVisita}"></label>
     <label>Meta: relatórios no prazo (%)<input class="field num" type="number" min="0" max="100" id="c_mR" name="metaRel" value="${c.metaRel}"></label>
     <span></span>
     <label>Ocupação ideal: mínimo (%)<input class="field num" type="number" min="0" max="100" id="c_oMin" name="ocupMin" value="${c.ocupMin}"></label>
     <label>Ocupação ideal: máximo (%)<input class="field num" type="number" min="0" max="100" id="c_oMax" name="ocupMax" value="${c.ocupMax}"></label>
     <label class="full">Assinatura do e-mail de confirmação<textarea class="field" id="c_assinatura" name="assinatura">${esc(c.assinatura)}</textarea></label>
     <p class="ferr" id="cerr" hidden></p>
     <div class="actions"><div class="right"><button class="btn primary" type="submit">Salvar regras</button></div></div>
    </form>
   </section>
   <section class="panel"><h3>Quem acessa o quê</h3><div class="rows" style="font-size:.9rem">
    <div class="row" style="cursor:default"><div class="main"><div class="t">Gestão</div><div class="s">Acesso de Editor no menu Compartilhar. Vê as três áreas, dá o aceite, envia os e-mails e acompanha os indicadores.</div></div></div>
    <div class="row" style="cursor:default"><div class="main"><div class="t">Representantes e técnicos</div><div class="s">Acesso de Colaborador. No primeiro acesso cada pessoa escolhe a própria área e se identifica.</div></div></div>
   </div></section>
  </div>`;
}
function openCad(tipo,id){
  let corpo='',titulo='';
  if(tipo==='tec'){const d=id?byId(S.tec,id)||{}:{};titulo=id?'Editar técnico':'Novo técnico';corpo=`
   <label class="full">Nome do técnico <span class="req">*</span><input class="field" id="k_nome" name="nome" value="${esc(d.nome||'')}"></label>
   <label>E-mail <span class="req">*</span><input class="field" id="k_email" name="email" type="email" value="${esc(d.email||'')}"></label>
   <label>Telefone<input class="field" id="k_ttel" name="telefone" type="tel" value="${esc(d.telefone||'')}"></label>
   <label>Cidade de moradia<input class="field" id="k_tcid" name="cidadeBase" placeholder="Ex.: Uberaba/MG" value="${esc(d.cidadeBase||'')}"></label>
   <label>Região de atuação<input class="field" id="k_regiao" name="regiao" value="${esc(d.regiao||'')}"></label>
   <label class="full">Tratamento no e-mail<select class="field" id="k_trat" name="tratamento"><option value="o" ${d.tratamento!=='a'?'selected':''}>com o (ex.: "reservada com o Alexandre")</option><option value="a" ${d.tratamento==='a'?'selected':''}>com a (ex.: "reservada com a Ana")</option></select></label>`}
  else if(tipo==='reg'){const d=id?regInfo(id)||{}:{};titulo=id?'Editar regional':'Nova regional';corpo=`
   <label class="full">Nome da regional <span class="req">*</span><input class="field" id="k_nome" name="nome" value="${esc(d.nome||'')}" placeholder="Ex.: DF BRASILIA"></label>
   <label>Representante<input class="field" id="k_rep" name="representante" value="${esc(d.representante||'')}"></label>
   <label>E-mail do representante<input class="field" id="k_repmail" name="email" type="email" value="${esc(d.email||'')}"></label>
   <label>Telefone do representante<input class="field" id="k_reptel" name="telefone" type="tel" value="${esc(d.telefone||'')}"></label>
   <div class="fld full"><label for="cbKDist">Distrital</label>${cb('cbKDist',{kind:'dist',name:'distrital',value:d.distrital||'',placeholder:'Procurar distrital…'})}</div>`}
  else{const d=id?distInfo(id)||{}:{};const n=id?S.reg.filter(r=>r.distrital===id).length:0;titulo=id?'Editar distrital':'Novo distrital';corpo=`
   <label class="full">Nome do distrital <span class="req">*</span><input class="field" id="k_nome" name="nome" value="${esc(d.nome||'')}"></label>
   <label>E-mail do distrital<input class="field" id="k_email" name="email" type="email" value="${esc(d.email||'')}"></label>
   <label>Telefone do distrital<input class="field" id="k_tel" name="telefone" type="tel" value="${esc(d.telefone||'')}"></label>
   <p class="mini-empty full" style="font-size:.84rem">Com o e-mail preenchido, o distrital recebe cópia das confirmações de agenda das suas regionais.${id?` Este distrital tem ${n} regiona${n===1?'l':'is'}.`:''}</p>`}
  sheet(`<div class="head"><div class="grow"><h2>${titulo}</h2></div><button class="x" type="button" data-act="fechar" aria-label="Fechar">×</button></div>
  <form class="f" id="fcad" data-tipo="${tipo}" data-id="${esc(id||'')}" novalidate>${corpo}
   <p class="ferr" id="kerr" hidden></p>
   <div class="actions">${id?`<button class="btn danger" type="button" data-act="delcad">Excluir</button>`:''}<div class="right"><button class="btn" type="button" data-act="fechar">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></div>
  </form>`);
}

/* ================= detalhe da solicitação ================= */
function openSol(id,modo){
  const s=byId(S.sol,id);if(!s)return;
  const a=s.agendamento,r=s.relatorio,e=etapa(s);
  const passos=[['Solicitada',fmtTs(s.criadoEm)],['Agendada',a?.agendadoEm?fmtTs(a.agendadoEm):''],['Realizada',a&&['Relatório pendente','Concluída'].includes(e)?fmtD(a.fim||a.inicio):''],['Concluída',r?.enviadoEm?fmtTs(r.enviadoEm):'']];
  const idx={Solicitada:0,Agendada:1,'Relatório pendente':2,Concluída:3}[e]??-1;
  const dl=[['Código',s.codigo],['Solicitante',`${s.gerenteNome}${s.gerenteEmail?' · '+s.gerenteEmail:''}`],['Regional',s.regional],['Telefone da regional',regInfo(s.regional)?.telefone],['Distrital',s.distrital],['Telefone do distrital',distInfo(s.distrital)?.telefone],['Tipo de demanda',s.tipo],['Temas principais',(s.temas||[]).join(', ')+(s.temaOutro?` (${s.temaOutro})`:'')],['Objetivo',s.objetivo],['Clientes a visitar',s.clientesPrev],...(s.v===2?[]:PERGUNTAS.map(([k,l])=>[l,sn(s[k])])),['Urgência',`${s.urgencia}${s.dataSugerida?', data sugerida '+fmtD(s.dataSugerida):''}`],['Duração estimada',s.duracao],['Técnico de preferência',s.tecPref?tecNome(s.tecPref):''],['Cidade de chegada',s.cidadeChegada],['Cidade de hospedagem',s.v===2?'':s.cidadeHospedagem],...dlV2(s)].filter(x=>x[1]);
  const gest=S.gestor,souTec=S.perfil?.papel==='tecnico'&&a?.tecnicoId===S.perfil.tecnicoId;
  let corpo='';
  if(modo==='agendar')corpo=formAgendar(s);
  else if(modo==='naoag')corpo=`<div class="box"><b>Não agendar esta solicitação</b><form class="f" id="fnaoag" data-id="${s.id}" novalidate><fieldset class="full"><legend>Motivo <span class="req">*</span></legend><div class="opts">${MOT_NAOAG.map((m,i)=>`<label><input type="radio" name="motivo" id="na_${i}" value="${m}"> ${m}</label>`).join('')}</div></fieldset><label class="full">Observação para o solicitante<textarea class="field" id="na_obs" name="obs" placeholder="Ex.: sugerimos remarcar para a segunda quinzena de novembro."></textarea></label>${chkEmail()}<p class="ferr" id="naerr" hidden></p><div class="actions"><div class="right"><button class="btn" type="button" data-act="ver" data-id="${s.id}">Voltar</button><button class="btn primary" type="submit">Confirmar</button></div></div></form></div>`;
  else if(modo==='cancelar')corpo=`<div class="box"><b>Cancelar esta solicitação</b>${s.relatorio?'<p class="aviso-canc">Esta solicitação já tem relatório. Ao cancelar, o relatório deixa de contar nos indicadores, mas fica guardado aqui. Se for engano, use <b>Reabrir</b> para voltar como estava.</p>':''}<form class="f" id="fcanc" data-id="${s.id}" novalidate><fieldset class="full"><legend>Cancelamento por necessidade de quem? <span class="req">*</span></legend><div class="opts">${ORIGENS.map((o,i)=>`<label><input type="radio" name="origem" id="xo_${i}" value="${o}"> ${o}</label>`).join('')}</div></fieldset><label class="full">Motivo <span class="req">*</span><textarea class="field" id="x_motivo" name="motivo"></textarea></label>${s.relatorio?'':chkEmail(s.agendamento?.tecnicoId?'Enviar e-mail agora ao solicitante, com cópia para o distrital e o técnico':'')}<p class="ferr" id="xerr" hidden></p><div class="actions"><div class="right"><button class="btn" type="button" data-act="ver" data-id="${s.id}">Voltar</button><button class="btn danger" type="submit">Confirmar cancelamento</button></div></div></form></div>`;
  else{
    const ac=[];
    if(gest&&e==='Solicitada')ac.push(`<button class="btn primary" type="button" data-act="agendar" data-id="${s.id}">Dar aceite e agendar</button>`,`<button class="btn" type="button" data-act="naoag" data-id="${s.id}">Não agendar</button>`);
    if(gest&&(e==='Agendada'||e==='Relatório pendente'))ac.push(`<button class="btn" type="button" data-act="agendar" data-id="${s.id}">Reagendar</button>`);
    if((souTec||gest)&&(e==='Relatório pendente'||(e==='Agendada'&&hoje()>=a.inicio)))ac.push(`<button class="btn primary" type="button" data-act="relatorio" data-id="${s.id}">Preencher relatório</button>`);
    if((souTec||gest)&&e==='Concluída')ac.push(`<button class="btn" type="button" data-act="relatorio" data-id="${s.id}">${r?.enviadoEm?'Editar relatório':'Preencher relatório'}</button>`);
    if(gest&&r?.acaoGestao&&!r?.acaoVista)ac.push(`<button class="btn" type="button" data-act="acaovista" data-id="${s.id}">Marcar ação como tratada</button>`);
    if(S.canWrite&&(e==='Solicitada'&&(gest||s.criadoPor===S.uid)||gest&&(e==='Agendada'||e==='Relatório pendente'||e==='Concluída')))ac.push(`<button class="btn danger" type="button" data-act="cancelar" data-id="${s.id}">Cancelar</button>`);
    if(gest&&(e==='Cancelada'||e==='Não agendada'))ac.push(`<button class="btn" type="button" data-act="reabrir" data-id="${s.id}">Reabrir</button>`);
    corpo=(typeof dispensaRel==='function'&&dispensaRel(s)?`<p class="hint-box" style="margin:0 0 8px">Concluída sem relatório: em 2026, ${ehOnline(s)?'atendimentos online':'atendimentos de '+esc(tecNome(a.tecnicoId))} não precisavam enviar relatório.</p>`:'')+(ac.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${ac.join('')}</div>`:'')
     +(a?.tecnicoId&&!encerrada(s)?`<h3>Agendamento</h3><dl class="dl"><dt>Técnico</dt><dd>${esc(tecNome(a.tecnicoId))}${[byId(S.tec,a.tecnicoId)?.email,byId(S.tec,a.tecnicoId)?.telefone].filter(Boolean).map(x=>' · '+esc(x)).join('')}</dd><dt>Período</dt><dd>${periodoCurto(a)}</dd>${s.tecPref?`<dt>Técnico sugerido</dt><dd>${esc(tecNome(s.tecPref))}${s.tecPref!==a.tecnicoId?` · <b>trocado</b>${a.trocaMotivo?' ('+esc(a.trocaMotivo)+')':''}`:' · mantido'}</dd>`:''}${a.obs?`<dt>Observação</dt><dd>${esc(a.obs)}</dd>`:''}<dt>Confirmação por e-mail</dt><dd>${s.emailEnviadoEm?'Enviada em '+fmtTs(s.emailEnviadoEm):'Ainda não enviada'}</dd></dl>`:'')
     +(gest&&a?.tecnicoId&&!encerrada(s)&&e!=='Concluída'?painelEmail(s):'')
     +(r?.enviadoEm?relResumo(s):'')
     +(e==='Não agendada'?`<h3>Não agendada</h3><dl class="dl"><dt>Motivo</dt><dd>${esc(s.naoAg?.motivo||'—')}</dd>${s.naoAg?.obs?`<dt>Observação</dt><dd>${esc(s.naoAg.obs)}</dd>`:''}<dt>Decidido em</dt><dd>${fmtTs(s.naoAg?.em)}</dd><dt>Aviso por e-mail</dt><dd>${s.emailEnviadoEm?'Enviado em '+fmtTs(s.emailEnviadoEm):'Ainda não enviado'}</dd></dl>${gest?painelEmail(s,emailNaoAg(s),'E-mail ao representante'):''}`:'')
     +(e==='Cancelada'?`<h3>Cancelamento</h3><dl class="dl"><dt>Origem</dt><dd>${esc(s.cancelOrigem||'Não informada')}</dd><dt>Motivo</dt><dd>${esc(s.motivoCancelamento||'Sem motivo informado')}</dd>${s.relatorioCancelado?`<dt>Relatório</dt><dd>Desconsiderado (enviado em ${s.relatorioCancelado.enviadoEm?fmtTs(s.relatorioCancelado.enviadoEm):'—'}, cancelado em ${fmtTs(s.relatorioCancelado.canceladoEm)}). Use Reabrir para trazê-lo de volta.</dd>`:''}<dt>Aviso por e-mail</dt><dd>${s.emailEnviadoEm?'Enviado em '+fmtTs(s.emailEnviadoEm):'Ainda não enviado'}</dd></dl>${gest?painelEmail(s,emailCancel(s),'E-mail de cancelamento'):''}`:'')
     +((s.reagendamentos||[]).length?`<h3>Reagendamentos <span class="chip num">${s.reagendamentos.length}</span></h3><div class="rows">${s.reagendamentos.map(r=>`<div class="row" style="cursor:default"><div class="main"><div class="t">${esc(r.origem)}</div><div class="s">${esc(r.motivo)}</div><div class="s">Antes: ${esc(tecNome(r.de?.tecnicoId))} · ${periodoCurto(r.de)}</div></div><span class="chip num">${fmtTs(r.em)}</span></div>`).join('')}</div>`:'')
     +`<h3>Solicitação</h3><dl class="dl">${dl.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  }
  sheet(`<div class="head"><div class="grow"><h2>Regional ${esc(s.regional)}${s.distrital?' · '+esc(s.distrital):''}</h2><div class="chips"><span class="chip dot ${stCls(e)}">${e}</span>${s.urgencia==='Alta'&&e==='Solicitada'?'<span class="chip urg-Alta">Urgência alta</span>':''}<span class="chip">${esc(s.codigo||'')}</span></div></div><button class="x" type="button" data-act="fechar" aria-label="Fechar">×</button></div>
   ${!encerrada(s)?`<div class="timeline">${passos.map(([n,d],i)=>`<div class="st ${i<=idx?'on':''}"><b>${n}</b>${i<=idx?d:'—'}</div>`).join('')}</div>`:''}${corpo}`);
}
function relResumo(s){
  const r=s.relatorio;
  return `<h3>Relatório de atendimento</h3><dl class="dl"><dt>Período realizado</dt><dd>${fmtD(r.inicio)}${r.fim&&r.fim!==r.inicio?' a '+fmtD(r.fim):''}</dd><dt>Enviado em</dt><dd>${fmtTs(r.enviadoEm)}</dd>
   ${ATIV.filter(([k])=>+r.ativ?.[k]).map(([k,l])=>`<dt>${l}</dt><dd class="num">${r.ativ[k]}</dd>`).join('')}
   <dt>Organização da agenda</dt><dd class="num">${r.notaOrg??'—'} / 10</dd><dt>Roteiro cumprido</dt><dd>${esc(r.roteiro)}${r.roteiroExpl?' — '+esc(r.roteiroExpl):''}</dd>${r.sugestoes?`<dt>Sugestões</dt><dd>${esc(r.sugestoes)}</dd>`:''}${r.acaoGestao?`<dt>Ação da gestão</dt><dd>${r.acaoVista?'Tratada':'Solicitada pelo técnico'}</dd>`:''}</dl>
   ${(r.clientes||[]).length?`<div style="display:grid;gap:8px;margin-top:12px">${r.clientes.map(c=>`<div class="ccard" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${esc(c.nome)}</b><div class="s muted" style="font-size:.86rem">${[c.tipo||sitNorm(c.situacao),c.cidade,c.foco].filter(Boolean).map(esc).join(' · ')}${S.gestor&&fatCli(c,s)?' · '+brl(fatCli(c,s))+'/ano antes da visita':''}</div>${c.nota?`<div style="margin-top:4px;white-space:pre-wrap">${esc(c.nota)}</div>`:''}</div><div>${S.gestor?segBadge(fatCli(c,s)):''}</div></div>`).join('')}</div>`:''}`;
}
function painelEmail(s,m,titulo){
  m=m||emailConfirmacao(s);
  return `<h3>${titulo||'E-mail de confirmação'}</h3><div class="box">
   <div class="mailhead"><span>Para</span><span>${esc(m.para||'— e-mail do solicitante não informado —')}</span><span>Cc</span><span>${esc(m.cc||'— técnico sem e-mail no cadastro —')}</span><span>Assunto</span><span>${esc(m.assunto)}</span></div>
   <div class="mail">${esc(m.corpo)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">
    ${window.ALTA_PLATAFORMA&&S.gestor&&m.para?`<button class="btn primary" type="button" data-act="enviaragora" data-id="${s.id}">${s.emailEnviadoEm?'Enviar de novo':'Enviar e-mail agora'}</button>`:''}
    <a class="btn${window.ALTA_PLATAFORMA&&S.gestor&&m.para?'':' primary'}" href="${esc(mailto(m))}" target="_blank" rel="noopener">Abrir no aplicativo de e-mail</a>
    <button class="btn" type="button" data-act="copiarmail" data-id="${s.id}">Copiar texto</button>
    <button class="btn" type="button" data-act="copiardest" data-id="${s.id}">Copiar destinatários</button>
    ${s.emailEnviadoEm?'':`<button class="btn" type="button" data-act="enviado" data-id="${s.id}">Marcar como enviado</button>`}
   </div>
   <p class="mini-empty" style="font-size:.82rem">Se o botão de abrir não funcionar, copie o texto e os destinatários para o seu e-mail. Depois, marque como enviado: o representante passa a ver a confirmação na central.</p></div>`;
}
function formAgendar(s){
  const a=s.agendamento||{};
  return `<div class="box"><b>${a.tecnicoId?'Reagendar':'Dar aceite e agendar'}</b>
   <form class="f" id="fag" data-id="${s.id}" novalidate>
    <label class="full">Técnico responsável <span class="req">*</span><select class="field" id="a_tec" name="tecnicoId" data-pref="${esc(s.tecPref||'')}">${tecOpts(a.tecnicoId||s.tecPref||'','— Selecione o técnico —')}</select></label>
    ${s.tecPref?`<p class="hint-box full" style="margin:0">Técnico sugerido pelo solicitante: <b>${esc(tecNome(s.tecPref))}</b></p>
    <fieldset class="full" id="wrapTroca" ${(a.tecnicoId||s.tecPref)!==s.tecPref?'':'hidden'}><legend>Por que outro técnico? <span class="req">*</span></legend><div class="opts">${MOT_TROCA.map((m,i)=>`<label><input type="radio" name="trocaMotivo" id="tm_${i}" value="${m}" ${a.trocaMotivo===m?'checked':''}> ${m}</label>`).join('')}</div></fieldset>`:''}
    <label>Data de início <span class="req">*</span><input class="field" type="date" id="a_ini" name="inicio" value="${esc(a.inicio||s.dataSugerida||'')}"></label>
    <label>Data de término<input class="field" type="date" id="a_fim" name="fim" value="${esc(a.fim||'')}"></label>
    <div class="full" id="agConf"></div>
    ${a.tecnicoId?`<fieldset class="full"><legend>Reagendamento por necessidade de quem? <span class="req">*</span></legend><div class="opts">${ORIGENS.map((o,i)=>`<label><input type="radio" name="reagOrigem" id="ro_${i}" value="${o}"> ${o}</label>`).join('')}</div></fieldset>
    <label class="full">Motivo do reagendamento <span class="req">*</span><input class="field" id="a_rmot" name="reagMotivo" placeholder="Ex.: chuva impediu o acesso à fazenda; técnico deslocado para urgência"></label>`:''}
    <label class="full">Observação para o e-mail (opcional)<textarea class="field" id="a_obs" name="obs" placeholder="Ex.: chegada prevista às 8h na fazenda.">${esc(a.obs||'')}</textarea></label>
    <p class="hint-box full" style="margin:0">Ao confirmar, o atendimento entra automaticamente na agenda do técnico escolhido.</p>
    ${chkEmail('Enviar e-mail agora ao solicitante, com cópia para o distrital e o técnico')}
    <p class="ferr" id="aerr" ${S.tec.length?'hidden':''}>${S.tec.length?'':'Cadastre pelo menos um técnico em Cadastros.'}</p>
    <div class="actions"><div class="right"><button class="btn" type="button" data-act="ver" data-id="${s.id}">Voltar</button><button class="btn primary" type="submit">Confirmar agendamento</button></div></div>

function parseYM(v){
  if(v==null||v==='')return'';
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}`;
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`}
  const s=String(v).trim().toLowerCase();let m;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}`}
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})/)))return `${m[1]}-${String(+m[2]).padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/)))return `${m[2]}-${String(+m[1]).padStart(2,'0')}`;
  if((m=s.match(/^([a-zç]{3})[a-zç]*[\/\-. ]+(\d{2,4})$/))&&MESN[norm(m[1])]){let y=+m[2];if(y<100)y+=2000;return `${y}-${String(MESN[norm(m[1])]).padStart(2,'0')}`}
  return '';
}
function parseDia(v){

  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)))return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;

async function reconstruirClientes(){

  const naVenda=new Set();
  (S.vendas?.lista||[]).forEach(x=>{const k=normKey(x.n);const o={n:x.n};if(x.c)o.c=hcod(normCod(x.c));if(flags[k]){o.p=[...flags[k]];naVenda.add(k)}m[(o.c||'')+'|'+k]=o});

function agPodeEditar(p){if(!S.db||!S.canWrite)return false;if(S.gestor)return true;if(p==='geral'||p==='feriados')return false;return papelPlat()==='tecnico'&&S.perfil?.papel==='tecnico'&&S.perfil.tecnicoId===p}
const agPessoaNome=p=>p==='geral'?'Agenda Geral do Leite':p==='feriados'?'Feriados':tecNome(p);
function agPessoaPadrao(){if(S.ag.pessoa&&(S.ag.pessoa==='geral'||byId(S.tec,S.ag.pessoa)))return S.ag.pessoa;const meu=S.perfil?.papel==='tecnico'?S.perfil.tecnicoId:'';return meu||'geral'}
function agControles(modo){
  const p=agPessoaPadrao();
  return `<div class="filters agctl">
   ${modo==='cal'?`<label class="lblf">Agenda<select class="field" id="agpessoa"><option value="geral" ${p==='geral'?'selected':''}>Agenda Geral do Leite</option>${sortN(S.tec).map(t=>`<option value="${t.id}" ${p===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>`:''}
   ${agMesCtl()}
   ${S.gestor&&NA_PLATAFORMA?`<button class="btn small" type="button" data-act="agimport">Importar agenda atual</button>`:''}
  </div>`;
}
function agMesCtl(){const anos=[S.ag.ano-1,S.ag.ano,S.ag.ano+1];return `<div class="agmes"><button class="btn small" type="button" data-agmes="-1" aria-label="Mês anterior">‹</button><select class="field" id="agmes" aria-label="Mês">${MESES.map((m,i)=>`<option value="${i+1}" ${S.ag.mes===i+1?'selected':''}>${m}</option>`).join('')}</select><select class="field" id="agano" aria-label="Ano">${anos.map(a=>`<option ${S.ag.ano===a?'selected':''}>${a}</option>`).join('')}</select><button class="btn small" type="button" data-agmes="1" aria-label="Próximo mês">›</button><button class="btn small" type="button" data-agmes="0">Hoje</button></div>`}
function chipAg(x,p){const[l,c,ic]=AG_CAT[x.cat]||AG_CAT.outros;return `<span class="agchip${x.sol?' agvis':''}" style="--c:${c}" title="${esc(l+': '+x.txt)}"${x.sol?` data-act="ver" data-id="${x.sol.id}" role="button" tabindex="0"`:''}><i aria-hidden="true">${ic}</i>${esc(x.txt)}</span>`}
function agCalendario(p){
  const a=S.ag.ano,m=S.ag.mes,nd=new Date(a,m,0).getDate(),dow=new Date(a,m-1,1).getDay(),h=hoje();
  const pode=agPodeEditar(p);
  const resumo={};let aniv=[];
  for(let d=1;d<=nd;d++){agItens(p,isoDe(a,m,d)).forEach(x=>{resumo[x.cat]=(resumo[x.cat]||0)+1;if(x.cat==='aniversario')aniv.push(x.txt.replace(/^niver\s*/i,''))})}
  const cel=[];for(let i=0;i<dow;i++)cel.push('<div class="agd vazio"></div>');
  for(let d=1;d<=nd;d++){const iso=isoDe(a,m,d),it=agItens(p,iso),fer=it.some(x=>x.fer);
    cel.push(`<div class="agd${fimSemana(iso)?' fds':''}${fer?' fer':''}${iso===h?' hoje':''}${pode?' ed':''}"${pode?` data-agdia="${iso}" role="button" tabindex="0" aria-label="${d} de ${MESES[m-1]}: editar"`:''}><div class="agn"><span class="num">${d}</span>${iso===h?'<em>HOJE</em>':''}</div>${it.map(x=>chipAg(x,p)).join('')}</div>`)}
  return `<section class="agcal">
   <header class="agcab"><div><small>${p==='geral'?'CALENDÁRIO GERAL':'TÉCNICO(A)'}</small><h3>${esc(agPessoaNome(p))}</h3><span>${p==='geral'?'Eventos gerais · Programas e Serviços · Leite':'Programas e Serviços · Leite'}${pode?' · clique em um dia para lançar':''}</span></div><b class="agmesb">${MESES[m-1]} ${a}</b></header>
   <div class="agres"><span class="lbl">Resumo do mês</span>${Object.keys(resumo).sort((x,y)=>AG_PRIO.indexOf(x)-AG_PRIO.indexOf(y)).map(k=>`<span><i style="background:${AG_CAT[k][1]}"></i>${AG_CAT[k][2]} ${AG_CAT[k][0]} <b class="num">${resumo[k]}</b></span>`).join('')||'<span class="muted">Nada lançado neste mês</span>'}</div>
   ${aniv.length?`<div class="aganiv">🎂 <b>Aniversariantes do mês:</b> ${esc([...new Set(aniv)].join(', '))}</div>`:''}
   <div class="aggrid">${DSEM.map((x,i)=>`<div class="agw${i===0||i===6?' fds':''}">${x}</div>`).join('')}${cel.join('')}</div>
  </section>`;
}
function agEquipe(){
  const a=S.ag.ano,m=S.ag.mes,nd=new Date(a,m,0).getDate(),h=hoje();
  const dias=[...Array(nd)].map((_,i)=>isoDe(a,m,i+1));
  const tecs=sortN(S.tec);
  return `<section class="panel"><h3>Equipe em ${MESES[m-1]} de ${a}<span class="hint">um quadrado por dia · cor da atividade principal</span></h3>
   <div class="tablewrap"><table class="agmat"><thead><tr><th>Técnico</th>${dias.map(d=>`<th class="${fimSemana(d)?'fds':''}${d===h?' hj':''}">${+d.slice(8)}<br><small>${DSEM[new Date(d+'T12:00').getDay()][0]}</small></th>`).join('')}</tr></thead>
   <tbody>${tecs.map(t=>`<tr><td><b>${esc(t.nome)}</b></td>${dias.map(d=>{const c=agPrincipal(t.id,d),it=agItens(t.id,d);const pode=agPodeEditar(t.id);return `<td class="${fimSemana(d)?'fds':''}${d===h?' hj':''}"><span class="agq${pode?' ed':''}" ${c?`style="--c:${AG_CAT[c][1]}"`:''} title="${esc(fmtD(d)+(it.length?' · '+it.map(x=>AG_CAT[x.cat][0]+': '+x.txt).join(' | '):' · sem registro'))}"${pode?` data-agdia="${d}" data-agp="${t.id}" role="button" tabindex="0"`:''}>${c?AG_CAT[c][2]:''}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="agleg">${AG_PRIO.filter(k=>k!=='aniversario').map(k=>`<span><i style="background:${AG_CAT[k][1]}"></i>${AG_CAT[k][0]}</span>`).join('')}</div></section>`;
}
function gagt(){
  const sub=['cal','equipe','visitas'].includes(S.sub.gagt)?S.sub.gagt:'cal';
  let corpo='';
  if(sub==='cal')corpo=agControles('cal')+agCalendario(agPessoaPadrao());
  if(sub==='equipe')corpo=agControles('equipe')+agEquipe();
  if(sub==='visitas')corpo=gagenda().replace(/<div class="bar"><h2>Agenda técnica<\/h2><\/div>/,'');
  return titulo(2,'Agenda Técnica','Calendário de cada técnico e da equipe. As visitas agendadas na Central entram sozinhas.')+subnav('gagt',[['cal','Calendário'],['equipe','Visão da equipe'],['visitas','Visitas agendadas']])+(S.ag.carregada?'':'<p class="mini-empty">Carregando a agenda…</p>')+corpo;
}
/* Equipe técnica: minha agenda em calendário + visitas */
function tagendaCal(){
  const id=meuTecId();
  if(!id)return '';
  if(!S.ag.pessoa||S.ag.pessoaTec!==id){S.ag.pessoa=id;S.ag.pessoaTec=id}

/* ---------- editor do dia ---------- */
function agAbrirDia(p,iso){
  if(!agPodeEditar(p))return;
  const brutos=agBruto(p,iso).map(agParse);
  S.agEd={p,iso,linhas:brutos.map(x=>({...x,nova:false}))};
  if(!S.agEd.linhas.length)S.agEd.linhas.push({cat:'atendimento',txt:'',nova:true});
  agDesenharDia();
}
function agDesenharDia(){
  const E=S.agEd,dt=new Date(E.iso+'T12:00');
  const fixos=agItens(E.p,E.iso).filter(x=>x.fer||x.sol);

    <fieldset class="full agrep"><legend>Repetir os compromissos novos</legend>
     <label>até o dia<input class="field" type="date" id="agate" min="${addDias(E.iso,1)}" value="${esc(E.ate||'')}"></label>
     <label class="chk"><input type="checkbox" id="agutil" ${E.util!==false?'checked':''}> só dias úteis</label></fieldset>
    <p class="ferr full" id="agerr" hidden></p>
    <div class="actions full"><div class="right"><button class="btn" type="button" data-act="fechar">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></div>
   </form>`);
}
const agCodificar=x=>`${x.cat}|${String(x.txt).trim()}`;
async function agSalvarDia(){
  const E=S.agEd,err=$('#agerr');
  const linhas=E.linhas.filter(x=>String(x.txt).trim()||x.cat!=='outros').map(x=>({...x,txt:String(x.txt).trim()||AG_CAT[x.cat][0]}));
  const ate=$('#agate')?.value||'',util=$('#agutil')?.checked;
  if(ate&&ate<=E.iso){err.textContent='A data final da repetição precisa ser depois deste dia.';err.hidden=false;return}
  const muda={};const por=(iso,lista)=>{const id=agDocId(E.p,iso.slice(0,4));(muda[id]=muda[id]||{_pessoa:E.p,_ano:+iso.slice(0,4)})[iso.slice(5)]=lista};
  por(E.iso,linhas.map(agCodificar));
  const novas=linhas.filter(x=>x.nova);
  if(ate&&novas.length){for(let d=addDias(E.iso,1);d<=ate;d=addDias(d,1)){if(util&&(fimSemana(d)||(agFeriados(+d.slice(0,4))[d])))continue;const ex=agBruto(E.p,d);por(d,[...ex,...novas.map(agCodificar).filter(c=>!ex.includes(c))])}}
  const bt=$('#fagdia [type=submit]');if(bt){bt.disabled=true;bt.textContent='Salvando…'}
  try{
   for(const id of Object.keys(muda)){await S.db.collection(P_AG).doc(id).update(muda[id]);Object.assign(S.ag.docs[id]=S.ag.docs[id]||{},muda[id])}
   closeSheet();S.agEd=null;render();toast('Agenda salva');
  }catch(x){if(bt){bt.disabled=false;bt.textContent='Salvar'}err.textContent=x&&x.message||'Não foi possível salvar.';err.hidden=false}
}

/* ---------- capacidade pela agenda ---------- */
function agCapacidade(a,m){
  const nd=new Date(a,m,0).getDate(),fer=agFeriados(a);
  const linhas=sortN(S.tec).map(t=>{const o={t,uteis:0,campo:0,atend:0,desl:0,trein:0,ho:0,aus:0,outros:0,vazio:0};
    for(let d=1;d<=nd;d++){const iso=isoDe(a,m,d);if(fimSemana(iso)||fer[iso])continue;o.uteis++;const c=agPrincipal(t.id,iso);
      if(c==='atendimento'){o.atend++;o.campo++}else if(c==='deslocamento'){o.desl++;o.campo++}else if(['treinamento','evento','reuniao'].includes(c))o.trein++;else if(c==='homeoffice')o.ho++;else if(['ferias','livre','particular'].includes(c))o.aus++;else if(c==='outros'||c==='aniversario')o.outros++;else o.vazio++}
    return o});
  const tot=linhas.reduce((x,o)=>{Object.keys(o).forEach(k=>{if(k!=='t')x[k]=(x[k]||0)+o[k]});return x},{});
  return{linhas,tot};
}

  const a=S.ag.ano,m=S.ag.mes,{linhas,tot}=agCapacidade(a,m);

  return `<h3 class="sec" id="sec-agcap">Dias da equipe pela Agenda Técnica<span>${MESES[m-1]} de ${a}</span></h3>
  <div class="filters">${agMesCtl()}</div>

   <div class="kpi" style="--k:var(--s-ok)"><div class="lbl">Dias em campo</div><div class="val num">${tot.campo||0}</div><div class="sub">atendimento e deslocamento · ${pctTxt(pc(tot.campo,tot.uteis))} dos dias úteis</div></div>
   <div class="kpi" style="--k:var(--accent)"><div class="lbl">Ocupação dos dias disponíveis</div><div class="val num">${pctTxt(pc(tot.campo,(tot.uteis||0)-(tot.aus||0)))}</div><div class="sub">descontando férias, folgas e particulares</div></div>
   <div class="kpi" style="--k:var(--c3)"><div class="lbl">Treinamento, eventos e reuniões</div><div class="val num">${tot.trein||0}</div><div class="sub">dias</div></div>
   <div class="kpi" style="--k:var(--line)"><div class="lbl">Dias úteis sem registro</div><div class="val num">${tot.vazio||0}</div><div class="sub">lançar na agenda melhora a leitura</div></div>
  </div>
  <section class="panel" style="margin-bottom:16px"><div class="tablewrap"><table class="plac" style="min-width:860px"><thead><tr><th>Técnico</th><th class="r">Dias úteis</th><th class="r">🐄 Atendimento</th><th class="r">🚗 Deslocamento</th><th class="r">🎓 Trein./evento/reunião</th><th class="r">🏠 Home office</th><th class="r">🏖️ Férias/folga</th><th class="r">Sem registro</th><th class="r">Em campo</th></tr></thead><tbody>
   ${linhas.map(o=>{const p=pc(o.campo,disp(o)),f=farolFaixa(p,cfg().ocupMin,cfg().ocupMax);return `<tr style="cursor:default"><td><b>${esc(o.t.nome)}</b></td><td class="r num">${o.uteis}</td><td class="r num">${o.atend}</td><td class="r num">${o.desl}</td><td class="r num">${o.trein}</td><td class="r num">${o.ho}</td><td class="r num">${o.aus}</td><td class="r num muted">${o.vazio}</td><td class="r num"><span class="chip ${f.cls?'f-'+f.cls:''}">${pctTxt(p)}</span></td></tr>`}).join('')}
  </tbody></table></div><p class="mini-empty" style="font-size:.8rem;margin-top:8px">Cada dia útil conta pela atividade principal lançada na agenda (visitas agendadas na Central contam como atendimento). "Em campo" = atendimento + deslocamento sobre os dias disponíveis. Faixa ideal ${cfg().ocupMin}–${cfg().ocupMax}%.</p></section>`;

/* ---------- aviso de conflito ao agendar ---------- */
function agConflitoHint(){
  const box=$('#agConf');if(!box)return;
  const f=$('#fag'),tec=f?.elements.tecnicoId.value,ini=f?.elements.inicio.value,fim=f?.elements.fim.value||ini;
  if(!tec||!ini||fim<ini){box.innerHTML='';return}
  const sid=f.dataset.id,av=[];
  for(let d=ini;d<=fim&&av.length<12;d=addDias(d,1)){agItens(tec,d).filter(x=>!(x.sol&&x.sol.id===sid)&&!['aniversario','homeoffice','outros'].includes(x.cat)).forEach(x=>av.push(`${fmtD(d).slice(0,5)}: ${AG_CAT[x.cat][2]} ${esc(x.txt)}`))}
  box.innerHTML=av.length?`<div class="hint-box agaviso"><b>Atenção à agenda de ${esc(tecNome(tec))}:</b><br>${av.join('<br>')}</div>`:`<div class="hint-box">Agenda de ${esc(tecNome(tec))} livre nesse período.</div>`;
}

/* ---------- importar a agenda atual (altaleite.github.io/agenda) ---------- */
const AG_URL='https://altaleite.github.io/agenda/';
function agExtrair(h,nome){const i=h.search(new RegExp('(const|let|var)\\s+'+nome+'\\s*=\\s*\\{'));if(i<0)return null;let j=h.indexOf('{',i),d=0,k=j,str=null;for(;k<h.length;k++){const c=h[k];if(str){if(c==='\\'){k++;continue}if(c===str)str=null;continue}if(c==='"'||c==="'"||c==='`'){str=c;continue}if(c==='{')d++;else if(c==='}'){d--;if(!d)break}}try{return JSON.parse(h.slice(j,k+1))}catch(e){return null}}
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function agSugerir(nome){
  if(/geral/i.test(nome))return'geral';
  const n=norm(nome).split(/\s+/);
  const t=S.tec.find(t=>{const m=norm(t.nome).split(/\s+/);return m[0]===n[0]&&(n.length<2||m.includes(n[n.length-1]))});
  return t?t.id:'novo';
}
async function agImportarAbrir(){
  sheet(`<div class="shead"><h2>Importar agenda atual</h2><button class="btn small" type="button" data-act="fechar">Fechar</button></div><p class="muted">Buscando a agenda em altaleite.github.io/agenda…</p>`);
  try{
    const r=await fetch(AG_URL,{cache:'no-store'});const h=await r.text();
    const fontes={2026:agExtrair(h,'AGENDA'),2027:agExtrair(h,'AGENDA_2027')};
    const fer={2026:agExtrair(h,'FERIADOS_2026'),2027:agExtrair(h,'FERIADOS_2027')};
    if(!fontes[2026])throw new Error('Não encontrei os dados da agenda na página.');
    const nomes=[...new Set(Object.values(fontes).filter(Boolean).flatMap(o=>Object.keys(o)))];
    const conta=n=>Object.values(fontes).filter(Boolean).reduce((t,o)=>t+Object.values(o[n]||{}).reduce((x,mm)=>x+Object.values(mm).reduce((y,l)=>y+(l||[]).length,0),0),0);
    S.agImp={fontes,fer,nomes:nomes.map(n=>({n,c:conta(n),dest:agSugerir(n)}))};
    agImportarDesenhar();
  }catch(x){sheet(`<div class="shead"><h2>Importar agenda atual</h2><button class="btn small" type="button" data-act="fechar">Fechar</button></div><p class="ferr">${esc(x.message||'Não foi possível ler a agenda atual.')}</p>`)}
}
function agImportarDesenhar(){
  const I=S.agImp;
  sheet(`<div class="shead"><h2>Importar agenda atual</h2><button class="btn small" type="button" data-act="fechar">Fechar</button></div>
   <p class="muted" style="margin-top:0">Encontrei ${I.nomes.length} agendas em 2026${I.fontes[2027]?' e 2027':''}. Confirme para onde vai cada uma. Os feriados vão para todas as agendas.</p>
   <div class="tablewrap"><table style="min-width:520px"><thead><tr><th>Na agenda atual</th><th class="r">Lançamentos</th><th>Na plataforma</th></tr></thead><tbody>
   ${I.nomes.map((x,i)=>`<tr style="cursor:default"><td><b>${esc(x.n)}</b></td><td class="r num">${x.c}</td><td><select class="field" data-agimp="${i}"><option value="">— Não importar —</option><option value="geral" ${x.dest==='geral'?'selected':''}>Agenda Geral do Leite</option>${sortN(S.tec).map(t=>`<option value="${t.id}" ${x.dest===t.id?'selected':''}>${esc(t.nome)}</option>`).join('')}<option value="novo" ${x.dest==='novo'?'selected':''}>+ Cadastrar como novo técnico</option></select></td></tr>`).join('')}
   </tbody></table></div>
   <p class="hint-box">O que já estiver lançado na plataforma para essas pessoas será substituído pela agenda atual. Visitas agendadas na Central não são afetadas.</p>
   <p class="ferr" id="agierr" hidden></p>
   <div class="actions"><div class="right"><button class="btn" type="button" data-act="fechar">Cancelar</button><button class="btn primary" type="button" data-act="agimpok">Importar</button></div></div>`);
}
async function agImportarExecutar(bt){
  const I=S.agImp,err=$('#agierr');bt.disabled=true;bt.textContent='Importando…';
  try{
    const docs=[];
    for(const x of I.nomes){
      if(!x.dest)continue;let dest=x.dest;
      if(dest==='novo'){let id=slug(x.n)||'tecnico';while(byId(S.tec,id))id+='-2';docs.push({col:P_TEC,id,data:{nome:x.n,email:'',criadoEm:Date.now(),origem:'agenda'}});S.tec.push({id,nome:x.n});dest=id}
      for(const ano of Object.keys(I.fontes)){const src=I.fontes[ano];if(!src||!src[x.n])continue;const d={_pessoa:dest,_ano:+ano};
        Object.entries(src[x.n]).forEach(([mes,dias])=>{const mi=MESES.indexOf(mes)+1;if(!mi)return;Object.entries(dias||{}).forEach(([dia,l])=>{const k=pad2(mi)+'-'+pad2(dia);const v=(l||[]).map(String).filter(s=>s.trim()&&!/^feriado\|/.test(s)).map(s=>agCodificar(agParse(s)));if(v.length)d[k]=[...(d[k]||[]),...v]})});
        const id=agDocId(dest,ano),ex=docs.find(z=>z.col===P_AG&&z.id===id);if(ex)Object.entries(d).forEach(([k,v])=>{if(Array.isArray(v))ex.data[k]=[...(ex.data[k]||[]),...v]});else docs.push({col:P_AG,id,data:d})}
    }
    Object.entries(I.fer).forEach(([ano,o])=>{if(!o)return;const d={_pessoa:'feriados',_ano:+ano};Object.entries(o).forEach(([mes,dias])=>{const mi=MESES.indexOf(mes)+1;if(!mi)return;Object.entries(dias||{}).forEach(([dia,l])=>{const v=(l||[]).map(s=>'feriado|'+agParse(s).txt);if(v.length)d[pad2(mi)+'-'+pad2(dia)]=v})});docs.push({col:P_AG,id:agDocId('feriados',ano),data:d})});

async function fazerBackup(bt){

    await dl.save({filename:'central-leite-backup-'+hoje()+'.json',data:new Blob([JSON.stringify({versao:1,criadoEm:Date.now(),docs})],{type:'application/json'})});
    toast(docs.length+' documentos no backup')}catch(x){const e=$('#berr');if(e){e.textContent=x.message;e.hidden=false}}

async function importarBackup(){
